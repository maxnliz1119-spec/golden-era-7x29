const initial={tab:"home",growTab:"stats",turnNo:1,turnStart:"2027-02-01",city:"上海",project:"《七楼以南》",storyTitle:"开机前的十五天",storyMeta:"2027.02.01—02.15 · 上海",story:[
"二月的前半个月像被人从中间折过一次。前几天还在北京，她把最后一批行李塞进行李箱，和旧朋友在运动馆里耗掉一个晚上；再睁眼，酒店窗外已经换成上海潮湿发白的天。城市戏没有荒郊野外的漫长转场，也没有古装头套压在额头上的钝痛，可每一天依然被切得很细。围读、定妆、职业观察、动作走位、品牌团队临时插进来的确认电话，全都看起来只占一点时间，合在一起却把完整的一天拆得几乎没有缝。",
"田曦薇开始真正进入周望。她越来越确定，这个人物最难演的不是强，而是她太习惯把自己收拾得像什么都能处理。开会被否掉方案以后继续翻下一页，和朋友争吵以后先确认第二天客户有没有改时间，最需要别人问一句‘你还好吗’的时候，反而会说自己先去洗澡。过去她可能会在剧本上写很多情绪词，现在只留下越来越少的标记，有时甚至只是一条线。",
"私人生活没有因为进组就完全消失。母亲仍然会在天气降温时重复问她外套有没有带够，程曼的消息永远最有效率。王安宇在她飞上海以后没有突然变成每天报道的人，偶尔在共同群里出现，私下的联系却停在一种刚好不会打扰的位置。张凌赫更安静，上一场《逐玉》旧人局以后，他很快又回到自己的拍摄节奏里。田曦薇并不觉得这有什么异常——演员的生活本来就是这样，有时候密集共处几个月，杀青以后便隔着几座城市，各自进入下一段日程。",
"她反而喜欢这种不被剧情追着跑的感觉。人与人之间没有每一天都必须发生新鲜事，关系也不是靠消息数量证明。真正留下来的，往往只是一些很小的偏差：谁会在忙完以后还记得一句旧话，谁在同一个场合下意识站得近一点，又有谁即便长时间不联系，再见面时仍然能把没讲完的话接上。",
"这个回合还有几件事情没有发生。手机里有需要她决定要不要回应的人，生活也仍然可以被她自己安排一次。她甚至还有机会在这个月真正离开酒店和片场，去看看上海，而不是把这座城市只记成酒店、车窗和摄影棚。十五天以后，这些看起来很小的决定会一起进入下一段生活。"],

const lifeOptions={"完整休息":{desc:"真正留出一天不工作、不社交。",delta:{健康:3},results:["她真的空出了一天。睡到自然醒，吃完饭又在沙发上躺了很久。什么特殊事件都没有发生，但第二天镜子里的状态比前几天好得明显。","休息日被她过得非常普通。没有偶遇，也没有灵感爆发，下午甚至睡了第二觉。"]},"运动管理":{desc:"力量、拉伸和体能恢复。",delta:{健康:2,外形:1},results:["她把两次轻量训练塞进工作间隙，没有追求强度，肩颈和睡眠反而比前半月稳定。"]},"摄影练习":{desc:"继续胶片习惯。",delta:{共情力:1,魅力:1},results:["她带相机走了两次，拍的不是人，而是雨后的车窗、早餐店玻璃和工作人员放在角落的一把伞。没有任何特殊剧情发生。"]},"观影阅读":{desc:"看电影，读和工作无关的书。",delta:{共情力:2,表演理解:1},results:["她难得把注意力从周望身上挪开。电影结束以后没有立刻做表演笔记，只记住了一个人物沉默很久的镜头。"]},"台词训练":{desc:"安排专业台词/声音训练。",delta:{台词能力:3,健康:-1},results:["老师没有让她继续追求更清楚，而是让她试着把一句话说得更像人在想事情。两个小时以后嗓子有点累，但她对周望的语速有了新的判断。"]},"造型护理":{desc:"皮肤、体态和衣橱状态管理。",delta:{外形:2,魅力:1},results:["这次没有红毯，也没有公开活动。她只是把身体状态和几套日常衣服重新整理好，镜头前的疲态少了一点。"]}};
const cityLocations={"武康路":{delta:{魅力:1},outcomes:["她戴着帽子走了不到一个小时，买了咖啡，拍了几张照片。没有遇见任何熟人。","一家独立书店的选书让她停了很久，最后带走一本摄影集。"]},"苏州河":{delta:{共情力:1},outcomes:["傍晚风很冷，她沿河走了一段，什么也没发生，只把脑子里的工作声慢慢走散了。","她远远看见一组学生在拍短片，没有过去，只站着看了几分钟。"]},"愚园路":{delta:{观众缘:1},outcomes:["她在一家小店被店员认出来，对方没有声张，只在结账时小声说很喜欢她上一部戏。她道了谢，没有合照。","这次探索没有触发任何事件，只买到一块很好吃的蛋糕。"]},"西岸":{delta:{外形:1,魅力:1},outcomes:["她看了一个小型展览，离开时天已经暗了。没有业内人士，也没有偶遇。","空间里的一组影像作品让她突然想到周望的一场戏，但她没有立刻拿手机记下来。"]}};
function clone(x){return JSON.parse(JSON.stringify(x))}let s=load();function load(){try{return Object.assign(clone(initial),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return clone(initial)}}function save(){localStorage.setItem(KEY,JSON.stringify(s))}function pad(n){return String(n).padStart(2,"0")}function dateObj(str){return new Date(str+"T12:00:00")}function fmt(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function turnEnd(){const d=dateObj(s.turnStart);d.setDate(d.getDate()+14);return fmt(d)}function turnRangeLabel(){return `${s.turnStart.replaceAll("-",".")}—${turnEnd().slice(5).replace("-",".")}`}function monthKey(){return s.turnStart.slice(0,7)}function ageNow(){const d=dateObj(s.turnStart),b=new Date("1997-10-14T12:00:00");let a=d.getFullYear()-b.getFullYear();if((d.getMonth()<b.getMonth())||(d.getMonth()==b.getMonth()&&d.getDate()<b.getDate()))a--;return a}function specialEvents(){const start=dateObj(s.turnStart),end=dateObj(turnEnd()),raw=[["01-01","元旦"],["02-14","情人节"],["05-01","劳动节"],["10-01","国庆"],["10-14","田曦薇生日"],["12-31","跨年"]];let out=[];for(const [md,name] of raw){for(let y=start.getFullYear()-1;y<=end.getFullYear()+1;y++){const d=new Date(`${y}-${md}T12:00:00`);if(d>=start&&d<=end)out.push(name)}}return out}function activeMessages(){return Object.entries(s.turnMessages||{}).filter(([k,v])=>v&&v.active)}function messagesResolved(){return activeMessages().every(([k])=>s.interactions[k])}function canAdvance(){return messagesResolved()&&!!s.lifeChoice}function applyDelta(d){for(const [k,v] of Object.entries(d||{}))s.stats[k]=Math.max(0,Math.min(100,(s.stats[k]||0)+v))}function toast(t){let x=document.querySelector(".toast");if(!x){x=document.createElement("div");x.className="toast";document.body.appendChild(x)}x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1700)}function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}function nav(tab){s.tab=tab;save();render()}
function render(){document.querySelectorAll(".bottom button").forEach(b=>b.classList.toggle("active",b.dataset.tab===s.tab));const titles={home:"她的黄金时代",turn:"回合剧情",messages:"私人消息",grow:"个人养成",relations:"人物关系"};document.getElementById("title").textContent=titles[s.tab];const v=document.getElementById("view");if(s.tab==="home")v.innerHTML=home();if(s.tab==="turn")v.innerHTML=turn();if(s.tab==="messages")v.innerHTML=messages();if(s.tab==="grow")v.innerHTML=grow();if(s.tab==="relations")v.innerHTML=relations();bind()}
function check(title,desc,done,optional=false){return `<div class="check"><span class="mark ${done?"done":""}">${done?"✓":"·"}</span><span><b>${title}</b><small>${desc}</small></span><span class="status">${optional?"可选":done?"完成":"待办"}</span></div>`}
function home(){const sp=specialEvents(),resolved=activeMessages().filter(([k])=>s.interactions[k]).length,total=activeMessages().length;return `<div class="hero" style="background-image:url('${IMG.cover}')"><div class="hero-text"><small>TURN ${s.turnNo} / 约240</small><h2>${turnRangeLabel()}</h2><p>${s.city} · ${s.project}<br>29—39岁十年养成线</p></div></div><div class="turnbar"><div class="pill"><small>年龄</small><strong>${ageNow()} 岁</strong></div><div class="pill"><small>城市</small><strong>${s.city}</strong></div><div class="pill"><small>阶段</small><strong>15天回合</strong></div></div>${sp.length?`<div class="special"><b>✦ 本回合特殊日期：${sp.join(" / ")}</b><p>特殊日期可能影响消息、私人事件、工作安排或关系走向，不保证一定触发恋爱剧情。</p></div>`:""}<div class="section"><h3>本回合进度</h3><span>完成后统一推进剧情</span></div><div class="card checklist">${check("短信阶段",`${resolved}/${total} 位联系人已处理`,messagesResolved())}${check("生活手帐",s.lifeChoice?`已选择：${s.lifeChoice}`:"本回合只能选择一次",!!s.lifeChoice)}${check("城市探索",s.usedExploreMonths[monthKey()]?`本月已探索：${s.exploration?.location||"已完成"}`:"本月可选一次",!!s.usedExploreMonths[monthKey()],true)}${check("剧情推进",canAdvance()?"可以生成本回合长剧情":"先完成短信与生活手帐",false)}</div><button class="primary" style="margin-top:11px" ${canAdvance()?"":"disabled"} data-action="advance">汇总本回合 · 推进15天剧情</button><div class="grid2" style="margin-top:10px"><button class="shortcut" data-action="tab:messages"><span class="sym">✉</span><b>处理短信</b><small>不是每个人都会出现</small></button><button class="shortcut" data-action="grow:life"><span class="sym">✦</span><b>生活手帐</b><small>${s.lifeChoice?"本回合已完成":"只能选择一次"}</small></button><button class="shortcut" data-action="grow:stats"><span class="sym">◇</span><b>个人属性</b><small>养成会改变十年结局</small></button><button class="shortcut" data-action="grow:city"><span class="sym">⌖</span><b>${s.city}地图</b><small>每月最多探索一次</small></button></div>`}
function turn(){return `<div class="prose-head" style="background-image:url('${IMG.story}')"><div class="prose-title"><small>${s.storyMeta}</small><h2>${s.storyTitle}</h2></div></div><article class="prose">${(s.story||[]).map(p=>`<p>${p}</p>`).join("")}</article><div class="card turn-actions"><div class="kicker">TURN INPUT</div><p>不再每做一件事就生成剧情。等短信和生活选择处理完，再把整个15天的行为一次交给 ChatGPT，让人物心理和上下文一起写进去。</p>${s.lifeChoice?`<span class="summary-chip">生活：${s.lifeChoice}</span>`:""}${Object.entries(s.interactions).map(([k,v])=>`<span class="summary-chip">${contactName(k)}：${v.skipped?"未回复":"已互动"}</span>`).join("")}<button class="primary" style="margin-top:12px" ${canAdvance()?"":"disabled"} data-action="advance">生成本回合完整后续剧情</button></div>`}
function contactName(k){return persona[k]?.name||({cheng:"程曼",mom:"妈妈"}[k]||k)}function contactAvatar(k){if(persona[k])return `<span class="avatar" style="background-image:url('${persona[k].img}')"></span>`;return `<span class="avatar text">${k==="cheng"?"程":"妈"}</span>`}
function messages(){if(s.openChat)return chat(s.openChat);const order=["wang","zhang","song","hou","cheng","mom"];return `<div class="special"><b>短信不是每日签到</b><p>只有本回合具备真实联系理由的人才会出现消息。每个人最多一轮：你回复一次，对方回应一次，然后本回合锁定。</p></div><div class="section"><h3>本回合联系人</h3><span>${turnRangeLabel()}</span></div><div class="msg-list">${order.map(k=>{const m=s.turnMessages?.[k],active=m?.active,done=s.interactions[k];let preview=active?m.incoming:(k==="zhang"?"本回合无私人消息 · 工作节奏很满":k==="song"?"本回合无新消息":k==="hou"?"尚未进入私人联系阶段":"本回合无新消息");return `<button class="msg ${(!active||done)?"locked":""}" data-action="${active?`chat:${k}`:"noop"}">${contactAvatar(k)}<span style="min-width:0"><h4>${contactName(k)}</h4><p>${done?(done.skipped?"本回合未回复":`本回合互动已结束 · ${done.npc}`):preview}</p></span><span class="right">${active?(done?"已结束":m.time):"—"}</span></button>`}).join("")}</div>`}
function chat(k){const m=s.turnMessages[k],done=s.interactions[k];return `<div class="chat-head"><button class="back" data-action="backmsg">‹</button>${contactAvatar(k)}<div><b>${contactName(k)}</b><div style="font-size:9px;color:var(--muted)">本回合一次互动</div></div></div><div class="chat"><div class="bubble them">${esc(m.incoming)}<div style="font-size:8px;opacity:.55;margin-top:4px">${m.time}</div></div>${done&&!done.skipped?`<div class="bubble me">${esc(done.player)}</div><div class="bubble them">${esc(done.npc)}</div>`:""}${done&&done.skipped?`<div class="round-end">你选择本回合不回复这条消息。</div>`:""}</div>${done?`<div class="round-end">本回合与 ${contactName(k)} 的短信互动已经结束。<br>下一次是否联系，由关系、工作状态和后续剧情决定。</div>`:`<div class="replyopts">${m.choices.map((x,i)=>`<button class="${x.skip?"skip":""}" data-action="reply:${k}:${i}">${esc(x.text)}</button>`).join("")}</div>`}`}
function grow(){return `<div class="segment"><button class="${s.growTab==="stats"?"active":""}" data-action="grow:stats">属性</button><button class="${s.growTab==="life"?"active":""}" data-action="grow:life">生活</button><button class="${s.growTab==="city"?"active":""}" data-action="grow:city">城市</button></div>${s.growTab==="stats"?statsPage():s.growTab==="life"?lifePage():cityPage()}`}
function statsPage(){return `<div class="card"><div class="stat-head"><div class="profile"><div class="portrait" style="background-image:url('${IMG.tian}')"></div><div><h3>田曦薇</h3><small>${s.project} · ${s.city}</small></div></div><span class="agebadge">${ageNow()}岁</span></div><div class="stats">${Object.entries(s.stats).map(([k,v])=>`<div class="stat"><div class="stat-top"><span>${k}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join("")}</div></div><div class="special" style="margin-top:11px"><b>十年结局不是最后一题决定</b><p>健康、作品选择、公众印象、表演能力、生活方式和私人关系都会长期累积。属性可以帮助打开机会，也可能因为长期透支形成代价。</p></div>`}
function lifePage(){if(s.lifeChoice)return `<div class="card result"><div class="kicker">TURN LIFE · LOCKED</div><h3 style="font-family:Georgia,'Songti SC',serif;margin:5px 0">${s.lifeChoice}</h3><p>${s.lifeResult.text}</p><div>${Object.entries(s.lifeResult.delta||{}).map(([k,v])=>`<span class="delta">${k} ${v>0?"+":""}${v}</span>`).join("")}</div><p style="color:var(--muted)">本回合已经完成生活选择，其他项目已锁定。下一回合重新开放。</p></div>`;return `<div class="special"><b>每15天只能选择一次</b><p>生活不是额外刷分小游戏。一次选择可能改变属性、进入下一段正文、形成长期习惯，也可能什么都没发生。</p></div><div class="section"><h3>生活手帐</h3><span>请选择 1 项</span></div><div class="life-grid">${Object.entries(lifeOptions).map(([k,v])=>`<button class="life" data-action="life:${k}"><span class="ico">${({完整休息:"☁",运动管理:"◌",摄影练习:"◉",观影阅读:"▶",台词训练:"♪",造型护理:"◇"})[k]}</span><b>${k}</b><p>${v.desc}</p></button>`).join("")}</div>`}
function cityPage(){const used=s.usedExploreMonths[monthKey()];return `<div class="special"><b>${s.city} · 月度探索</b><p>每个自然月最多一次。可能改变属性、触发特殊事件，也可能只是普通地走了一段路。</p></div><div class="map" style="margin-top:11px">${["武康路","苏州河","愚园路","西岸"].map((x,i)=>`<button class="pin p${i+1} ${used?"used":""}" ${used?"disabled":""} data-action="explore:${x}">${x}</button>`).join("")}</div>${used&&s.exploration?`<div class="card result" style="margin-top:10px"><div class="kicker">MONTHLY EXPLORE · DONE</div><h3 style="font-family:Georgia,'Songti SC',serif;margin:5px 0">${s.exploration.location}</h3><p>${s.exploration.text}</p>${Object.entries(s.exploration.delta||{}).map(([k,v])=>`<span class="delta">${k} ${v>0?"+":""}${v}</span>`).join("")}</div>`:""}`}
function relations(){return `<div class="special"><b>关系不显示硬好感值</b><p>同一个人十五天不发消息并不代表降好感。关系看的是长期主动性、信任、时间分配、边界变化和实际共同经历。</p></div><div class="relations" style="margin-top:10px">${Object.entries(persona).map(([k,p])=>`<button class="person" data-action="rel:${k}"><div class="photo" style="background-image:url('${p.img}')"></div><div class="body"><h4>${p.name}</h4><span class="tag">${p.tag}</span><p>${p.desc}</p></div></button>`).join("")}</div>`}
function bind(){document.querySelectorAll("[data-action]").forEach(el=>el.onclick=()=>act(el.dataset.action))}function act(a){if(a==="noop")return;if(a.startsWith("tab:"))return nav(a.split(":")[1]);if(a.startsWith("grow:")){s.tab="grow";s.growTab=a.split(":")[1];save();return render()}if(a.startsWith("chat:")){s.openChat=a.split(":")[1];save();return render()}if(a==="backmsg"){delete s.openChat;save();return render()}if(a.startsWith("reply:")){const [,k,idx]=a.split(":"),c=s.turnMessages[k].choices[+idx];s.interactions[k]=c.skip?{skipped:true}:{player:c.text,npc:c.reply};save();render();return}if(a.startsWith("life:"))return chooseLife(a.slice(5));if(a.startsWith("explore:"))return explore(a.slice(8));if(a.startsWith("rel:"))return relationModal(a.slice(4));if(a==="advance")return openAI();if(a==="settings")return settings()}
function chooseLife(k){if(s.lifeChoice)return toast("本回合已经做过生活选择");const opt=lifeOptions[k],text=opt.results[Math.floor(Math.random()*opt.results.length)];s.lifeChoice=k;s.lifeResult={text,delta:opt.delta};applyDelta(opt.delta);save();render();modal(`<div class="kicker">LIFE RESULT</div><h3>${k}</h3><p>${text}</p><p>这次结果已经写入本回合，其他生活选项锁定。</p>`)}function explore(k){if(s.usedExploreMonths[monthKey()])return toast("本月探索次数已经用完");const o=cityLocations[k],text=o.outcomes[Math.floor(Math.random()*o.outcomes.length)];s.exploration={location:k,text,delta:o.delta};s.usedExploreMonths[monthKey()]=true;applyDelta(o.delta);save();render();modal(`<div class="kicker">CITY EXPLORE</div><h3>${k}</h3><p>${text}</p><p>本月城市探索已经完成。</p>`)}function relationModal(k){const p=persona[k],arr=s.relations[k]||[];modal(`<div class="kicker">RELATION FILE</div><h3>${p.name}</h3><p><b>${p.tag}</b></p><p>${p.desc}</p><div class="divider"></div>${arr.map(x=>`<p>· ${x}</p>`).join("")}`)}
function interactionSummary(){return Object.entries(s.interactions).map(([k,v])=>v.skipped?`- ${contactName(k)}：本回合选择不回复。`:`- ${contactName(k)}来信；田曦薇回复：“${v.player}”；对方回应：“${v.npc}”`).join("\n")||"- 本回合没有私人短信互动。"}
function prompt(){return `继续《她的黄金时代》私人养成游戏。本游戏采用29—39岁十年养成制，每15天一个回合。\n\n【本回合】\n回合：${s.turnNo}\n时间：${s.turnStart} 至 ${turnEnd()}\n城市：${s.city}\n项目：${s.project}\n特殊日期：${specialEvents().join("、")||"无"}\n\n【田曦薇当前属性】\n${Object.entries(s.stats).map(([k,v])=>`${k}:${v}`).join(" / ")}\n\n【本回合短信，必须自然写入正文，不要机械复述】\n${interactionSummary()}\n\n【生活手帐】\n选择：${s.lifeChoice}\n结果：${s.lifeResult?.text||""}\n属性变化：${JSON.stringify(s.lifeResult?.delta||{})}\n\n【城市探索】\n${s.exploration?`${s.exploration.location}：${s.exploration.text}`:"本回合没有进行月度城市探索。"}\n\n【长期记忆】\n${s.memories.slice(-8).map(x=>"- "+x).join("\n")}\n\n【关系基线】\n王安宇：多年好友，温柔活泼、聪明敏感。上大学前未说破好感属于平行世界隐藏前史。越在意越容易内耗、靠近后退；互动大多轻松有趣。\n张凌赫：理性务实、高压上升期。私下联系应明显低频，田曦薇因《逐玉》拍摄期短暂好感和其长期CP营业，对私人真心保持防备。未升级关系前不要主动刷短信存在感。\n宋威龙：松弛幽默、外柔内刚，低频行动型。年龄更小但相处有稳定哥哥感。见面质量比消息数量重要。\n侯明昊：当前尚未真正进入私人圈。热烈直率、有音乐热情，不允许突然高频私聊。\n\n【现实社交规则】\n上升期男女艺人对绯闻风险敏感。关系早期优先多人局、共同朋友、品牌/剧组自然社交，不轻易公开单独约饭。NPC有自己的工作和生活，不围着田曦薇转。\n\n【写作】\n生成本回合结束后的完整文学剧情，目标约2500—4500中文字，篇幅可以根据事件密度浮动。第三人称，以田曦薇限知视角为主。中长段落，减少短句来回对白。把本回合短信回复、生活选择、城市探索真正融进上下文和人物心理，而不是列清单复述。人物声音差异要大。避免“心头一颤、呼吸一滞、眼底闪过、空气暧昧、低沉磁性嗓音”等网文套语。一段15天内可以有普通日常、工作推进、关系变化，也可以某条感情线完全不出现。不要每次结尾都强制给恋爱选择。\n\n完成正文后，返回下面的机器更新块。statsDelta只填写正文中新发生的额外变化，不要重复计算生活手帐和城市探索已经在游戏内即时结算的属性变化。必须是合法JSON：\n[GAME_UPDATE]\n{\n "nextStart":"下一回合开始日期YYYY-MM-DD（当前回合结束后一天）",\n "city":"下一回合城市",\n "project":"当前项目",\n "title":"本回合剧情标题",\n "meta":"剧情日期/地点摘要",\n "story":["按自然段拆分的正文段落1","段落2"],\n "statsDelta":{"健康":0,"外形":0,"魅力":0,"观众缘":0,"共情力":0,"台词能力":0,"表演理解":0,"事业判断":0},\n "memories":["仅保留真正影响长期剧情的1—4条记忆"],\n "relations":{"wang":[],"zhang":[],"song":[],"hou":[]},\n "turnMessages":{"wang":{"active":false},"zhang":{"active":false},"song":{"active":false},"hou":{"active":false},"cheng":{"active":false},"mom":{"active":false}}\n}\n[/GAME_UPDATE]\n\n如果下回合某个人应该发消息，将其active改为true，并提供time、incoming和choices。choices中每个玩家回复选项都必须有针对该选项的reply，最后可以提供skip:true的“不回复”。NPC回复必须逻辑连贯、符合人物人设。`}
function openAI(){if(!canAdvance())return toast("请先完成本回合短信和生活选择");modal(`<div class="kicker">TURN WRITERS' ROOM</div><h3>生成第 ${s.turnNo} 回合结算剧情</h3><p>本次会一次性把短信、生活手帐、探索与属性状态交给 ChatGPT。生成目标是2500—4500字，不再频繁复制粘贴。</p><textarea id="prompt" readonly>${esc(prompt())}</textarea><div class="modalrow"><button class="secondary" id="copy">复制给 ChatGPT</button><button class="primary" id="importShow">导入结果</button></div><div id="importArea" style="display:none;margin-top:10px"><textarea id="result" placeholder="把 ChatGPT 的完整回答粘贴到这里"></textarea><button class="primary" style="margin-top:8px" id="import">导入并进入下一回合</button></div>`);setTimeout(()=>{document.getElementById("copy").onclick=async()=>{await navigator.clipboard.writeText(prompt());toast("已复制回合请求")};document.getElementById("importShow").onclick=()=>document.getElementById("importArea").style.display="block";document.getElementById("import").onclick=()=>importAI(document.getElementById("result").value)},0)}
function importAI(txt){const m=txt.match(/\[GAME_UPDATE\]\s*([\s\S]*?)\s*\[\/GAME_UPDATE\]/);if(!m)return toast("没有识别到 GAME_UPDATE");try{const d=JSON.parse(m[1]);if(d.statsDelta)applyDelta(d.statsDelta);(d.memories||[]).forEach(x=>s.memories.push(x));for(const [k,arr] of Object.entries(d.relations||{}))if(Array.isArray(arr)&&arr.length)s.relations[k]=(s.relations[k]||[]).concat(arr);s.story=Array.isArray(d.story)?d.story:[String(d.story||"")];s.storyTitle=d.title||`第${s.turnNo}回合`;s.storyMeta=d.meta||`${s.turnStart}—${turnEnd()} · ${s.city}`;s.turnNo++;s.turnStart=d.nextStart||nextStart();s.city=d.city||s.city;s.project=d.project||s.project;s.turnMessages=d.turnMessages||{};s.interactions={};s.lifeChoice=null;s.lifeResult=null;s.exploration=null;delete s.openChat;s.tab="turn";save();closeModal();render();toast("已进入下一15天回合")}catch(e){toast("JSON格式无法解析")}}function nextStart(){const d=dateObj(turnEnd());d.setDate(d.getDate()+1);return fmt(d)}
function settings(){modal(`<div class="kicker">PRIVATE SAVE</div><h3>私人游戏设置</h3><p>存档只保存在当前浏览器设备。当前：第${s.turnNo}回合 / ${ageNow()}岁。</p><button class="secondary" style="width:100%;margin-bottom:7px" id="export">复制存档JSON</button><button class="secondary" style="width:100%;color:#a24f5e" id="reset">重置V2试玩存档</button>`);setTimeout(()=>{document.getElementById("export").onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(s));toast("存档已复制")};document.getElementById("reset").onclick=()=>{if(confirm("确定重置V2存档？")){localStorage.removeItem(KEY);location.reload()}}},0)}function modal(inner){document.getElementById("modalroot").innerHTML=`<div class="modalbg" id="bg"><div class="modal">${inner}<div class="modalrow"><button class="secondary" id="close">关闭</button></div></div></div>`;document.getElementById("close").onclick=closeModal;document.getElementById("bg").onclick=e=>{if(e.target.id==="bg")closeModal()}}function closeModal(){document.getElementById("modalroot").innerHTML=""}document.querySelectorAll(".bottom button").forEach(b=>b.onclick=()=>nav(b.dataset.tab));document.getElementById("settings").onclick=()=>settings();render();
</script></body></html>
