work","story":"她还是选择回熟悉的酒店。程曼接受得很快，只补了一条“车上别背词”。这些看似无关紧要的细节，反而组成了她现在工作生活真正的骨架。"},{"text":"这回合先不回复。","skip":true}]}}}],"chengzhi":[{"id":"cz31_scene","weight":4,"gap":1,"nodes":{"n1":{"incoming":"我刚看了今天那条。你后半段没接我那个停顿，比我们排的时候好。","choices":[{"text":"因为我当时真的以为你要忘词了。","reply":"很好，那说明我至少忘得很真实。下次我继续突然来，你别提前防我。","rel":1,"tone":"friend","story":"程知远说起表演时没有客套。田曦薇也很少在这种时候互相夸“演得好”，她更愿意承认自己当场真的被打乱。两个人越熟，越开始允许对方破坏排练出来的安全感，这对一部双女主戏比任何营业式“默契”都更有用。"},{"text":"我也喜欢那条。下次我可能会反过来打乱你。","reply":"可以。公平一点，不然总像我欺负你。","rel":2,"tone":"friend","story":"她第一次主动说，下次要反过来打乱对方。程知远接得很自然。所谓合作默契没有变成姐妹情口号，只是在一场一场戏里积累出一种更放心的冒险。"},{"text":"周末把那场重新对一遍？我想试另一个方向。","reply":"行。别在片场耗，我们找个安静地方过半小时。","rel":3,"tone":"friend","story":"她已经不满足于“这一条不错”，开始主动想第二种可能。程知远没有嫌麻烦，只约了半小时。田曦薇很清楚，这种愿意在正式工作之外继续碰角色的关系，正在从普通合作变成真正值得留下的同行连接。","req":{"stats":{"表演理解":84}}},{"text":"这回合先不回复。","skip":true}]}},"project":"《七楼以南》"},{"id":"cz31_dinner","weight":3,"gap":2,"nodes":{"n1":{"incoming":"化妆师她们周六想吃火锅，六七个人，不喝酒。你如果没夜戏一起？","choices":[{"text":"可以，只要别让我负责订位。","reply":"放心，你只负责出现。订位这种重活不交给主演。","rel":2,"tone":"friend","story":"多人饭局让她放松。没有必须单独赴约的意味，也没有宣传团队需要拍到的内容。程知远说“你只负责出现”，那一瞬间她甚至觉得这句话比很多正式的“我们关系很好”更像朋友。"},{"text":"先看通告，不加夜戏我就去。","reply":"行，不等你决定菜单。到时候能来直接过来。","rel":1,"tone":"friend","story":"她没有先承诺一定到，程知远也不追着确认。剧组里的友谊很多时候就是这样：谁都知道工作随时会改，但愿意给彼此留一把椅子。"},{"text":"这回合先不回复。","skip":true}]}},"project":"《七楼以南》"},{"id":"cz31_costume","weight":2,"gap":2,"nodes":{"n1":{"incoming":"你明天那套灰西装是不是又改腰了？我今天看服装组在找你尺寸。","choices":[{"text":"对，他们嫌我最近瘦了一点。","reply":"你先正常吃饭。角色疲惫不需要演员真的饿出来。","rel":1,"tone":"friend","story":"同组演员最容易看见彼此那些宣传照里不会出现的变化。程知远没夸她“瘦了好看”，反而先说正常吃饭。田曦薇听完有点想笑，也确实在晚餐时多吃了几口。"},{"text":"别提了，那条裤子已经改第三次。","reply":"我们服装老师快被你逼成结构工程师了。","rel":1,"tone":"friend","story":"她们聊的是一条改了三次的裤子，话题无聊得非常真实。田曦薇突然觉得，关系真正往朋友方向走，往往不是因为分享秘密，而是开始愿意把这些没什么意义的小事也讲给对方听。"},{"text":"这回合先不回复。","skip":true}]}},"project":"《七楼以南》"}],"atao":[{"id":"a31_food","weight":5,"gap":0,"nodes":{"n1":{"incoming":"姐，今天收工估计九点半。你想吃热汤还是米饭？我先看着，不然又只剩便利店。","choices":[{"text":"热汤，别太咸。","reply": tory":"剧本失而复得，阿桃甚至很有仪式感地强调“没有偷看演员秘密”。田曦薇接过来时发现对方真的只夹了一个书签。她忽然觉得，边界感有时候就藏在这么普通的动作里。"},{"text":"你可以看，反正我的字你也未必看得懂。","reply":"你对自己的字很有自知之明。谢谢。","rel":1,"tone":"friend","story":"她随口允许阿桃看，得到的不是好奇，而是一句对字迹的精准攻击。田曦薇翻开剧本笑了一会儿，紧绷的注意力也因此松下来。"},{"text":"这回合先不回复。","skip":true}]}}}],"mom":[{"id":"m31_food","weight":4,"gap":1,"nodes":{"n1":{"incoming":"今天吃得怎么样？我不问你吃没吃，我现在问质量。","choices":[{"text":"进步了，午饭有菜有肉，晚上还有汤。","reply":"这才像话。你爸刚还说让我别天天问，我看不问更不行。","rel":1,"tone":"family","story":"妈妈显然已经升级了提问方式，不再给她一句“吃了”就能混过去的机会。田曦薇把午饭和晚饭认真汇报了一遍，屏幕那边很快搬出爸爸当旁证。家里的关心总是这样，带点琐碎，也带点好笑。"},{"text":"今天质量一般，但至少不是咖啡配面包。","reply":"行，诚实也算进步。明天争取再进步一点。","rel":1,"tone":"family","story":"她没有为了让家里放心而编一顿完美晚餐，只说“质量一般”。妈妈也没有因此开始长篇教育，只给了一个“诚实算进步”。这种不需要表现得很好才能回家的感觉，让她一直觉得安稳。"},{"text":"这回合先不回复。","skip":true}]}}},{"id":"m31_home","weight":3,"gap":2,"nodes":{"n1":{"incoming":"你爸今天突然说等你回来想吃你上次嫌难吃的那家烤鱼，我怀疑他就是故意的。","choices":[{"text":"他是不是记仇记到现在？那家真的不好吃。","reply":"你回来自己跟他说，我不替你们判。","rel":1,"tone":"family","story":"家里并没有因为她在外面拍戏就暂停运转。爸爸仍然会记住一顿被她嫌弃过的烤鱼，妈妈也仍然拒绝做裁判。田曦薇看着消息，突然很具体地想家，不是想某个温情画面，而是想回去继续争论那家店到底难不难吃。"},{"text":"可以，再给它一次证明自己的机会。","reply":"我截图给你爸看，他现在已经觉得自己赢了。","rel":1,"tone":"family","story":"她松口以后，爸爸隔着妈妈的手机取得了一场迟到很久的胜利。这个消息在她一天的工作里毫无重要性，却恰好因此重要——它提醒她，生活并不是所有事情都要推动事业或关系。"},{"text":"这回合先不回复。","skip":true}]}}},{"id":"m31_weather","weight":2,"gap":2,"nodes":{"n1":{"incoming":"上海是不是下雨了？你小时候一到这种天气就不愿意起床。","choices":[{"text":"现在愿意，因为不起床要赔剧组钱。","reply":"那看来钱比我小时候叫你有用。","rel":1,"tone":"family","story":"她被一句“小时候不愿意起床”突然拽回很远的记忆。如今早班通告比任何闹钟都有效，可妈妈记住的还是那个雨天赖床的小孩。两种时间叠在一起，让她在化妆镜前短暂地觉得自己没有变得那么彻底。"},{"text":"确实下雨。你怎么连这个都知道？","reply":"天气预报啊。你以为只有年轻人会看手机？","rel":1,"tone":"family","story":"她问完就知道这个问题有点傻，果然立刻被妈妈反问回来。田曦薇笑着把手机放下，觉得家庭聊天的好处就是没有人需要一直聪明。"},{"text":"这回合先不回复。","skip":true}]}}},{"id":"m31_sleep","weight":2,"gap":2,"nodes":{"n1":{"incoming":"我今天不问吃饭，换一个。你昨天几点睡的？","choices":[{"text":"十二点多，已经算很早了。","reply":"你不要拿更晚的标准来证明十二点很早。","rel":1,"tone":"family","story":"妈妈换了检查项目，她还是没能顺利过关。田曦薇试图用“已经算很早”给自己辩护，对方一句话就拆穿了比较对象。她没再回嘴，决定今天尽量真的早点睡。"},{"text":"这个问题我选择申请律师。","reply":"申请无效。律师也得睡觉。","rel":1,"tone":"family","story":"她开始耍赖，妈妈也很熟练地驳回。很多人只在家里才有这种不需要维持成熟形象的自由，田曦薇也一样。"},{"text":"这回合先不回复。","skip":true}]}}}]},"career":[{"id":"c_restraint","project":"《七楼以南》","title":"一场需要收住的戏","desc":"导演觉得周望的情绪还可以再少一点，但摄影已经准备好下一条。","choices":[{"text":"再拍一条，把表面情绪再收掉。","result":"她主动要求补一条。最后留下的版本更安静，也更像周望已经习惯处理这种失望。","delta":{"表演理解":2,"健康":-1},"tags":["industry"],"req":{"stats":{"表演理解":82}},"narrative":["那场戏原本没有什么技术难度。周望从会议室出来，关门，走到走廊尽头，给同事发一条消息，再把一句近乎自嘲的解释说给自己听。排练已经顺了两遍，灯光也固定下来，导演却在正式开拍前忽然问她：最后那句话，真的需要吗？田曦薇拿着剧本站在监视器旁边，没有立刻回答。她知道删掉之后，观众会少一个明确答案，也知道演员最容易在这种时候害怕“别人看不懂”。","第三条，她把那句台词和原本设计好的叹气都拿掉。周望只是低头把手机屏幕按灭，顺手把文件边缘对齐，又重新打开工作群。没有委屈，也没有故意坚强。导演没有喊停得很快，摄影机多留了两秒。等“卡”响起来，现场也没人马上评价。田曦薇却知道那两秒为什么成立——人物不是没有情绪，只是已经没有把每一种情绪解释给别人听的习惯。"]},{"text":"保留当前版本，相信现场已经足够。","result":"她没有继续加码。回看时发现当前版本并不差，只是没有她预想得那么完整。","delta":{"事业判断":1,"健康":1},"tags":["industry"],"narrative":["导演提出再收一点时，她没有继续追求一个更“厉害”的版本。田曦薇坐回监视器前，把已经拍完的那条从头看了一遍。周望的情绪不是最隐蔽，却也没有溢出来。她忽然意识到，有时候演员对自己的不满足只是因为知道还有别的可能，并不等于眼前这个版本就一定需要被推翻。","她最终没有要求补拍。下一场灯光开始移动时，她把剧本合上。以前她会把这种选择理解成妥协，现在却更愿意把它叫判断：现场不是个人练功房，一部戏也不会因为某一条没有达到演员脑子里的满分就失去完整。"]},{"text":"先和导演再对十分钟人物动机，再决定删不删。","result":"她把决定往后放了一点，用讨论换取更清楚的人物逻辑。","delta":{"共情力":1,"表演理解":1,"健康":-1},"tags":["industry"],"req":{"stats":{"共情力":80}},"narrative":["她没有马上在“删”与“不删”之间选。摄影组已经准备完，现场时间很贵，她还是问导演能不能给十分钟。两个人站到走廊另一头，把周望在这一场之前的情绪重新捋了一遍。田曦薇关心的不是这句台词好不好，而是一个已经习惯承担的人，在独处时究竟还会不会向自己解释。","十分钟以后他们保留了半句。这个答案不像任何一个人一开始提出的方案，却更接近人物。重新开拍时，田曦薇明显感觉到前后动作有了因果，而不是为了“克制”去表演克制。收工后她虽然比预计晚了半小时，却并不觉得这半小时被浪费。"]}],"chapter":"没说出口的那一句"},{"id":"c_script","project":"《七楼以南》","title":"临时改戏","desc":"编剧临时调整了一场双女主对手戏，台词更锋利，但人物动机更难处理。","choices":[{"text":"先和程知远对人物动机，再决定怎么演。","result":"两个人没有急着对台词，而是先把角色为什么会说这句话聊清楚。正式拍摄反而很快。","delta":{"共情力":1,"表演理解":2},"rel":{"chengzhi":1},"tags":["industry"],"narrative":["新页递到手里时，场务已经在催下一组灯位。田曦薇没有急着背每一个字，先和程知远把人物为什么突然变锋利说清楚。两个人没有讨论语气，只确认哪一句是在防御，哪一句是真的想伤人。文本仍然陌生，动机却先有了落点。","正式拍摄时，程知远在其中一处故意停得比排练更久。田曦薇没有补那半拍的空白，只让周望看着对方。那一秒反而把新台词里最容易显得“写出来”的部分压了下去。导演留下了这一条，两个人走出画面以后也没有互相夸，只很轻地说了一句“这条顺”。"]},{"text":"先按新文本走一遍，再从表演里找问题。","result":"她先让身体和节奏碰一次文本。第一遍很生，却把最真实的问题暴露出来。","delta":{"台词能力":1,"表演理解":1},"tags":["industry"],"narrative":["她选择先让身体碰一次新文本。第一遍并不好，几个长句都有明显的“背出来”的痕迹，可问题因此暴露得很清楚：真正卡住她的不是字多，而是人物在中段为什么突然不再防守。","第二遍之前她只改了一件事——让周望在那句转折前先真正看一眼对方。台词还是同一页，节奏却开始像人在思考。田曦薇越来越相信，有些现场问题不是坐着分析到完全明白以后才解决，而是要先允许自己演得不够好一次。"]},{"text":"不把新句子背死，只抓逻辑，允许镜头里重新组织语言。","result":"她用台词与表演能力换来了更大的即兴空间。","delta":{"台词能力":2,"表演理解":2},"rel":{"chengzhi":1},"tags":["industry"],"req":{"stats":{"台词能力":74,"表演理解":83}},"narrative":["她只从头到尾读了两遍新页，用笔圈出三个信息点，没有试图在五分钟里把每个停顿都固定下来。真正开拍以后，她保留了文本的意思，却没有照着纸面速度往前冲；有两个词甚至像周望临时换出来的。","第一条结束，编剧从监视器后面抬头，没有要求她把那两个词改回去。导演只说，再来一条，保持这种“脑子比嘴快半拍”的感觉。第二条更顺。她回到休息椅时才把那页台词重新看完整，忽然发现自己已经不再把临时变化理解成一种打乱——如果人物足够清楚，语言本来就可以在一定范围里流动。"]}],"chapter":"纸页还热着"},{"id":"c_brand","title":"品牌活动撞上补拍","desc":"一个原本确认好的品牌露出临时要求提前半天，恰好撞上剧组补拍窗口。","choices":[{"text":"以拍摄为先，让程曼协调品牌。","result":"品牌最后把时间往后挪了。她没有得到额外曝光，却让剧组更放心。","delta":{"事业判断":2},"tags":["fashion","industry"],"narrative":["品牌活动提前的消息是在午饭时进来的。程曼把两张通告单摊在桌上，没有先告诉她哪一个更“重要”。田曦薇只看了一眼剧组补拍窗口，就说先保拍摄。不是因为演员工作天然比商业工作高贵，而是这场戏牵着几十个人的时间，品牌活动却仍有协调空间。","下午品牌最终把时间往后挪。她少了半天可以慢慢准备造型的时间，却没有因此觉得自己吃亏。真正让她松一口气的是第二天到片场时，没有任何人需要因为她重新拆一次灯。职业选择有时候并不浪漫，只是尽量让成本落在更少的人身上。"]},{"text":"尽量两边都保留，压缩休息时间。","result":"两边最终都完成了，但她那天明显更疲惫。工作没出错，身体却把账记了下来。","delta":{"魅力":1,"健康":-2},"tags":["fashion"],"narrative":["她试着保留两边。拍摄结束以后妆发直接在车上补，品牌现场只停留最短时间，再连夜回酒店。所有环节都完成得没有明显错误，照片也很好看。","可回到房间卸妆时，她才发现自己连晚饭是什么都想不起来。所谓“都能兼顾”有时只是把冲突从日程表上搬进身体里。第二天她仍然按时到片场，只是化妆师比平时多看了她两眼。"]},{"text":"让程曼直接提出替代方案：品牌改为远程确认，线下只保留必要露出。","result":"她没有在两个既定选项里硬选，而是重新谈条件。","delta":{"事业判断":3,"健康":1},"tags":["fashion","industry"],"req":{"stats":{"事业判断":78}},"narrative":["田曦薇没有在“去”与“不去”里选，而是问程曼，品牌真正不可替代的部分是什么。确认以后才发现，必须本人到场的环节只有二十分钟，其余内容都可以提前录或远程确认。","新的方案当天晚上就被接受。她第一次很明确地感到，事业判断并不只是挑项目，也包括不把别人给出的框架当成唯一答案。很多冲突不是天生需要牺牲一边，只是需要有人愿意重新谈一遍规则。"]}],"chapter":"两张通告单"},{"id":"c_offer","title":"新项目递来意向","desc":"一个都市悬疑项目在正式选角前先来问档期，角色比周望更冷，也更有攻击性。","choices":[{"text":"先看完整剧本，不因为类型差异急着答应。","result":"她把资料留了下来，却没有马上释放积极信号。程曼对这个反应很满意。","delta":{"事业判断":2},"tags":["offer"],"narrative":["剧本被打印成很厚的一摞，晚上送到酒店时已经接近十一点。两年前她可能会因为第一页人物设定就兴奋，现在却先去翻最后十集。她想知道这个女人前面的复杂究竟会不会在结尾被简单收掉。读到凌晨一点，她没有给程曼发“我喜欢”，只在备忘录里列了六个问题。","第二天下午，两个人在车上把项目拆开。角色、导演、平台、拍摄周期、后期预期，被分成几列。喜欢仍然重要，却不再是唯一标准。田曦薇看着窗外往后退的高架，突然觉得所谓三十岁附近的事业判断，并不是变得不冲动，而是学会让冲动也经过现实。"]},{"text":"先让团队了解主创和平台，再决定要不要看。","result":"她把精力留在当前项目，团队先去补齐制作背景。","delta":{"事业判断":1,"健康":1},"tags":["offer"],"narrative":["她先没有打开完整剧本，只让团队去补主创和平台的信息。角色的新鲜感很容易让人忽略项目本身，而她已经不想再因为“没演过这种人”就自动把机会看得更亮。","两天以后资料回到手里，她才重新开始读。这个顺序让很多最初的兴奋降了温，却也让真正留下来的兴趣更可靠。不是每一次谨慎都会错过机会，有时候谨慎只是帮人把机会看清楚。"]},{"text":"先约主创聊一次，判断他们如何理解这个女性角色。","result":"她把判断从纸面延伸到了合作对象。","delta":{"事业判断":2,"共情力":1},"tags":["offer","industry"],"req":{"stats":{"事业判断":80,"共情力":80}},"narrative":["她没有在剧本上做太多批注，先让程曼约了一次很小的主创见面。没有正式提案，也没有谁提前承诺。田曦薇更想知道，一个导演谈到女性角色时究竟会谈欲望、选择和代价，还是只谈“强”。","那次见面没有给她一个立即答案，却排除了两个原本在纸面上看不出的疑问。回酒店的车上，她对程曼说，可以继续看。程曼只回了一句“那就继续”，没有把一次正常判断包装成所谓重大事业节点。"]}],"chapter":"下一站还没有名字"},{"id":"c_interview","title":"第一次双人采访","desc":"平台想提前释放一点双女主物料，问题大多围绕角色关系和合作感受。","choices":[{"text":"重点放在角色和创作，不主动制造关系噱头。","result":"采访不算热闹，却很稳。观众对两个人的专业交流评价很好。","delta":{"观众缘":2,"事业判断":1},"rel":{"chengzhi":1},"tags":["industry"],"narrative":["采访棚比片场暖得多，灯也漂亮得多。主持人问她们“谁更像角色里的那一个”，又追问第一次见面对彼此的印象。程知远看了她一眼，田曦薇先笑，说第一次见面其实只记得菜上得很慢。现场有人笑，气氛松下来，问题也没有被推成必须制造某种姐妹情的方向。","后半段谈到一场对手戏，她们反而说得很细。哪里故意改过停顿，哪里第一次排练失败，哪一句台词直到开拍前还没有统一理解。宣传同事后来觉得这一段“不够甜”，却没有删。物料发出去后，真正被讨论最多的恰好是这几分钟。田曦薇看了一眼评论，没有特别兴奋，只觉得观众有时候比行业想象得更愿意听正常人说话。"]},{"text":"适当增加轻松互动，让物料更有传播性。","result":"现场气氛更活，传播也更快。她第一次明显感到宣传也是表演工作的一部分。","delta":{"魅力":1,"观众缘":2},"rel":{"chengzhi":1},"tags":["fashion"],"narrative":["田曦薇知道平台需要能被剪出来的片段，因此没有把所有问题都回答成创作访谈。主持人问谁更容易笑场，她直接指程知远，对方立刻反驳，两个人把一段很普通的片场事故讲得很有节奏。笑声是真的，表情也不需要设计。","但当问题开始靠近“私下最依赖谁”时，她很自然地把答案带回整个剧组，没有继续往双人关系上堆。宣传同事拿到了想要的轻松素材，她也没有觉得自己被迫演了一段关系。对她来说，这种边界感本身也是越来越熟练的职业能力。"]},{"text":"录制前删掉两道明显诱导关系营销的问题。","result":"她把宣传边界提前说清楚。","delta":{"事业判断":2},"rel":{"chengzhi":1},"tags":["industry"],"req":{"stats":{"事业判断":78}},"narrative":["问题单本身没有真正越界，但有两道题显然是为了把普通合作剪成更暧昧的关系想象。田曦薇没有等正式录制再临场绕，而是在开始前直接和宣传同事说，这两题不做。语气不重，也没有长篇解释。","对方犹豫了几分钟，最后换成角色问题。整个采访因此少了两段可能更容易上热搜的内容，却也没有任何尴尬。程知远收工时只说了一句“这样挺好”。很多边界越早说清楚，越不需要在事后用情绪补救。"]}],"chapter":"不必每句话都好听"}],"ambient":[{"id":"e_night","weight":4,"title":"连续夜戏","text":"这一阶段夜戏比预计多。她没有真正生病，只是睡眠开始变浅，早上化妆时需要更久才能完全清醒。","delta":{"健康":-1},"chapter":"身体先说了不","narrative":["连续几个早班以后，身体比她本人更早表达了意见。那天上午她没有发烧，也谈不上生病，只是站久了会有一种不明显的发虚。化妆师先发现她脸色不对，程曼随后把下午一个非必要确认会取消。","田曦薇没有因此上演“我可以坚持”的戏码。午休时她真的睡了四十分钟，醒来以后才重新看下午的通告。成年以后很多自律并不是逼自己完成更多，而是终于肯承认身体也有投票权。"]},{"id":"e_goodscene","weight":4,"title":"意外顺利的一条","text":"有一场原本预计要磨很久的戏，第一条就留下了。现场没有庆祝，大家很快开始准备下一场，但这种顺利本身让她心情很好。","delta":{"表演理解":1},"chapter":"第一条就留下","narrative":["有一场原本预计要磨很久的戏，第一条就留下了。导演喊“过”的时候甚至没有特别提高声音，现场只是很快开始移动机器。田曦薇坐回椅子上还有一点没反应过来，因为她已经做好了再拍六七遍的准备。","真正让她高兴的不是“一条过”本身，而是那场戏没有靠运气。前面几周积累的角色习惯在镜头打开以后自动接上，她不需要再提醒自己周望此刻该怎么坐、怎么听。所谓进入人物，也许就是某一天开始，不再需要一直证明自己已经进入。"]},{"id":"e_staff","weight":3,"title":"剧组里的小事","text":"收工时工作人员顺手给她留了一杯热水。只是很小的照顾，却让漫长的一天没那么像纯粹的工作机器。","delta":{"共情力":1},"chapter":"热水没有台词","narrative":["收工时工作人员顺手给她留了一杯热水。只是很小的照顾，对方甚至没有等她道谢就继续去收东西。田曦薇站在片场边喝了两口，忽然觉得漫长的一天没有那么像一台只负责产出镜头的机器。","她越来越容易注意到这些不属于主演视角的细节：谁一直在搬同一箱器材，谁在大家开饭以后才坐下。共情并不总是宏大的理解，有时候只是终于看见别人也在过自己的这一天。"]},{"id":"e_route","weight":2,"title":"一组路透","text":"网上出现一组不算清晰的路透。讨论没有爆，但不少人觉得她这次的状态比预想中更成熟。","delta":{"观众缘":1,"外形":1},"chapter":"模糊路透","narrative":["网上出现一组不算清晰的路透，拍的是她穿着周望的通勤装从楼里出来。照片角度一般，甚至能看见旁边的反光板。讨论没有爆，却有人说她这次看起来“没那么像偶像剧女主”。","田曦薇盯着那句话看了几秒，没有判断是夸还是贬。过去她可能会下意识确认照片好不好看，现在反而更在意观众是不是已经从外形里读到一点角色。镜头之外的评价仍然不可控，但她对什么值得在意，已经比以前更清楚。"]},{"id":"e_quiet","weight":5,"title":"普通的一天","text":"这个阶段也有完全普通的日子：按点开工、按点收工，没有偶遇，没有热搜，没有特别重要的消息。她反而慢慢习惯这种平静。","delta":{},"chapter":"什么也没发生的两天","narrative":["这个阶段也有完全普通的日子：按点开工、按点收工，没有偶遇，没有热搜，没有特别重要的消息。两天甚至没有任何值得她在睡前复盘的事。","田曦薇反而慢慢习惯这种平静。人生不是每十五天都应该出现一个转折，关系也不是只要打开游戏就必须发放新事件。那些没有剧情感的时间，才让真正发生的东西有了重量。"]},{"id":"e_industry","weight":2,"title":"行业里的消息","text":"程曼在车上随口提到几个项目的变化。没有一个需要她立刻做决定，但这些碎片让她越来越能看懂行业节奏。","delta":{"事业判断":1},"tags":["industry"],"chapter":"车上的几句话","narrative":["程曼在车上随口提到几个项目的变化：一个导演换平台，一部戏延期，一个原本很热的角色突然又重新找人。她说得像天气，田曦薇却开始能从这些碎片里听见行业真正的节奏。","没有任何一条消息需要她立刻做决定。她也没有追问别人为什么没谈成。很多职业判断并不是在自己面对选择时才产生，而是在无数旁观里慢慢建立坐标。"]},{"id":"e_music","weight":1,"title":"一个音乐活动的交集","text":"品牌方提到下月可能有一场音乐与时装结合的活动，嘉宾名单里出现侯明昊。两人仍没有私人联系，但第一次有了合理交集。","delta":{},"special":"hou_intro","chapter":"名单上的一个名字","narrative":["品牌团队发来下月一场音乐与时装活动的初步名单时，田曦薇只是快速扫了一遍。侯明昊的名字在中间，不靠前，也没有任何特别标记。她记得上一次活动里远远见过他，却没有真正说过几句话。","这件事当天没有继续发展。没有共同朋友立刻来组局，也没有不合逻辑的私人消息。它只是先在现实里放下一块很小的连接点，等以后有没有机会真正发生，再由时间决定。"]}],"explore":{"上海":[{"id":"x_film","title":"苏州河独立影像放映","kind":"独立影像","place":"河边小型放映空间","text":"放映结束以后她没有马上走，只坐在最后一排听了一会儿散场的脚步声。","delta":{"共情力":1},"story":"那天下午她去了苏州河边一场很小的独立影像放映。场地甚至没有正式影院那么黑，最后一排能看见门缝里进来的光。散场以后，她没有马上跟着人群出去，只多坐了两分钟。城市的声音重新从门外进来时，她突然觉得工作之外的时间不是“逃离剧组”，它本来就应该属于生活。"},{"id":"x_museum","title":"西岸美术馆夜场","kind":"展览","place":"西岸艺术区","text":"夜场的人比白天少，她慢慢看完一组影像作品，回程时一直在想镜头里的留白。","delta":{"表演理解":1,"魅力":1},"story":"西岸夜场的人比她预想得少。她看一组影像作品看得很慢，中间没有拍照，也没有急着理解作者到底想表达什么。回程时她脑子里反复出现的只是一个画面：空房间里一把没有人的椅子。那种允许观众自己补完意义的留白，和她最近在表演里尝试的东西意外地连在一起。"},{"id":"x_cafe","title":"旧洋房里的咖啡馆","kind":"城市日常","place":"武康路附近","text":"她在窗边坐了四十分钟。没有遇见熟人，只把上海从酒店和片场之外重新看了一眼。","delta":{"健康":1},"story":"她一个人去了武康路附近一家藏在旧洋房里的咖啡馆。没有特意找最隐蔽的位置，也没有一直担心会不会被认出来。窗外有人遛狗，有人拎着超市袋子匆匆经过。她坐了四十分钟，第一次觉得上海不再只是酒店、摄影棚和地下车库之间的连线。"},{"id":"x_salon","title":"品牌香氛沙龙","kind":"轻社交","place":"静安买手店","text":"活动人数很少，聊天比拍照多。她听见一些看似闲谈、其实有用的行业信息。","delta":{"魅力":1,"事业判断":1},"tags":["fashion"],"story":"香氛沙龙的人不多，品牌方也没有安排密集拍照。她真正记住的是一个做编辑的女生说，很多女演员到了某个阶段会突然开始害怕“没有新鲜感”。田曦薇没有接着讨论别人，只在回去的车上想了一会儿：新鲜到底应该来自不停换样子，还是来自一个人真的继续变化。"},{"id":"x_girls","title":"剧组女生的小饭局","kind":"朋友局","place":"一间安静的小餐厅","text":"程知远、化妆师和几个女工作人员都在。没有工作会议，她久违地只是坐下来吃了一顿饭。","delta":{"健康":1,"共情力":1},"rel":{"chengzhi":2,"atao":1},"story":"那顿饭没有任何值得发微博的照片。程知远、阿桃、化妆师和几个女工作人员坐了一桌，聊到后来连剧组都很少提。田曦薇忽然发现，自己已经很久没有在一张桌子上只做一个普通参加者——不负责气氛，不负责被看，也不负责给谁留下印象。"}]},"lifeStories":{"rest":"她真的空出了一天。没有“顺便看一下剧本”，也没有把休息变成护理、运动和社交的另一张任务表。上午睡到自然醒，下午甚至有一段时间只是坐在窗边发呆。刚开始她会因为这种无产出感到轻微不安，到了傍晚才发现，脑子里那些一直同时运行的东西终于少了几个窗口。","exercise":"她去做了一次很轻的恢复训练。教练没有让她追求任何漂亮数据，只重新检查肩背和核心的发力。田曦薇一开始还嫌强度太低，做到后半程却发现，真正困难的是不用意志力压过身体的反馈。运动结束以后，她反而比高强度训练时更轻松。","read":"她选了一部并不直接对应周望的电影。没有开倍速，也没有一边看一边记所谓表演技巧。看到中段一个人物沉默很久的镜头时，她忽然想到最近删掉的那些解释性动作。艺术经验很少会按一比一的方式变成工作方法，但它会在某个需要决定的瞬间，替人提供另一种可能。","voice":"台词老师让她把一段已经很熟的文本重新说得“不完整”——允许呼吸打断句子，允许思考发生在词语之间。练到最后嗓子有些累，她却第一次发现，清楚并不等于每个字都被打磨得同样光滑。人真正说话的时候，本来就会有犹豫、吞回去的词和突然改变的句尾。","care":"她把半天用来处理那些一直被往后推的小事：修头发、做基础护理、重新试几套之后活动可能用到的衣服。没有红毯，也没有镜头，这些事情因此不再像“维持女明星状态”，更像把自己的身体和生活重新收拾到舒服的位置。","social":"她去了一场很小的多人饭局，都是认识的人带认识的人，没有谁需要特意坐在谁旁边。田曦薇大多数时候听别人说，偶尔才插一句。她发现自己越来越喜欢这种不以“认识更多人”为目标的社交——只是吃饭、笑几次，然后各自回去。"}};

function toast(t){let e=document.querySelector(".toast");if(!e){e=document.createElement("div");e.className="toast";document.body.appendChild(e)}e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1400)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function weighted(a){let sum=a.reduce((q,x)=>q+(x.weight||1),0),r=Math.random()*sum;for(const x of a){r-=x.weight||1;if(r<=0)return x}return a[a.length-1]}
function reqCheck(req,id=null){if(!req)return{ok:true,text:""};let miss=[];if(req.stats)for(const[k,v]of Object.entries(req.stats))if((state.stats[k]||0)<v)miss.push(`${k}≥${v}`);if(req.rel){if(typeof req.rel==="number"&&id&&(state.relations[id]?.score||0)<req.rel)miss.push("关系更进一步");else if(typeof req.rel==="object")for(const[k,v]of Object.entries(req.rel))if((state.relations[k]?.score||0)<v)miss.push(`${person(k).name}关系更进一步`)}return{ok:miss.length===0,text:miss.join(" · ")}}

function genCareer(){let p=content.career.filter(x=>!x.project||x.project===state.project).filter(x=>!state.usedCareer.includes(x.id));if(!p.length)p=content.career.filter(x=>!x.project||x.project===state.project);state.current.career={id:p[Math.floor(Math.random()*p.length)].id,choice:null}}
function genMessages(){let options=[];for(const id of state.knownPeople){let pool=content.messages[id]||[],gap=state.turnNo-(state.relations[id]?.last??-99);for(const t of pool){if((t.gap||0)>gap)continue;if(t.project&&t.project!==state.project)continue;if(t.requires&&!contextHas(t.requires))continue;if(state.usedMessages.includes(t.id))continue;let w=t.weight||1;if(id==="zhang")w*=.35;if(id==="song")w*=.45;if(id==="hou")w*=.3;options.push({id,t,weight:w})}}let chosen=[];while(options.length&&chosen.length<3){let x=weighted(options);chosen.push(x);options=options.filter(y=>y.id!==x.id)}for(const x of chosen){let practical=["chengman","atao","mom","chengzhi"].includes(x.id);if(practical||Math.random()<.62)state.current.messages[x.id]={tree:x.t.id,node:"n1",done:false,n:0,log:[{from:"npc",text:x.t.nodes.n1.incoming}],hooks:[]}}if(!Object.keys(state.current.messages).length){for(const id of ["atao","chengman","mom"]){let t=(content.messages[id]||[]).find(x=>!state.usedMessages.includes(x.id)&&((x.gap||0)<=state.turnNo-(state.relations[id]?.last??-99)));if(t){state.current.messages[id]={tree:t.id,node:"n1",done:false,n:0,log:[{from:"npc",text:t.nodes.n1.incoming}],hooks:[]};break}}}}
function tree(id){let th=state.current.messages[id];return (content.messages[id]||[]).find(x=>x.id===th?.tree)}function node(id){let th=state.current.messages[id];return th&&!th.done?tree(id)?.nodes?.[th.node]:null}
function reply(id,i){let th=state.current.messages[id],n=node(id),c=n?.choices?.[i];if(!c)return;let rc=reqCheck(c.req,id);if(!rc.ok)return toast("当前关系或属性还不足");if(c.skip){th.log.push({from:"me",text:"（这回合先不回复）"});th.done=true;state.relations[id].last=state.turnNo;if(!state.usedMessages.includes(th.tree))state.usedMessages.push(th.tree);save();render();return}th.log.push({from:"me",text:c.text},{from:"npc",text:c.reply});th.n++;if(c.rel)relDelta({[id]:c.rel});if(c.story)th.hooks.push({story:c.story,tone:c.tone||"",id});if(c.next&&th.n<10&&tree(id)?.nodes?.[c.next]){th.node=c.next;th.log.push({from:"npc",text:tree(id).nodes[c.next].incoming})}else{th.done=true;state.relations[id].last=state.turnNo;if(!state.usedMessages.includes(th.tree))state.usedMessages.push(th.tree)}save();render()}
function life(k){if(state.current.life)return toast("本回合已经选择过生活安排");let M={rest:["完整休息",content.lifeStories.rest,{健康:3}],exercise:["运动恢复",content.lifeStories.exercise,{健康:2,外形:1}],read:["观影阅读",content.lifeStories.read,{共情力:2,表演理解:1}],voice:["台词训练",content.lifeStories.voice,{台词能力:3,健康:-1}],care:["状态管理",content.lifeStories.care,{外形:2,魅力:1}],social:["小范围朋友局",content.lifeStories.social,{魅力:1,共情力:1}]};let x=M[k];state.current.life={key:k,title:x[0],text:x[1],delta:x[2]};delta(x[2]);save();render()}
function explore(id){if(state.usedExplore[month()])return toast("这个月已经探索过一次");let e=(content.explore[state.city]||[]).find(x=>x.id===id);if(!e)return;state.current.explore=e;state.usedExplore[month()]=true;delta(e.delta);relDelta(e.rel);(e.tags||[]).forEach(t=>state.current.tags.push(t));save();render()}
function career(i){if(state.current.career.choice!==null)return toast("事业选择已经锁定");let e=content.career.find(x=>x.id===state.current.career.id),c=e.choices[i],rc=reqCheck(c.req);if(!rc.ok)return toast("当前属性或关系不足");state.current.career.choice=i;delta(c.delta);relDelta(c.rel);(c.tags||[]).forEach(t=>{if(!state.current.tags.includes(t))state.current.tags.push(t)});save();render()}
function msgsDone(){return Object.values(state.current.messages).every(x=>x.done)}function canSettle(){return msgsDone()&&state.current.life&&state.current.career.choice!==null}
function openingParagraph(){if(state.stats.健康<=72)return "上海真正进入拍摄节奏以后，时间不再按星期来算，而是按早班、夜戏和通告单上不断被修改的箭头往前走。田曦薇这半个月最先意识到的不是角色变得更熟，而是身体开始对每一次睡眠不足留下记录。她仍然能在开机声响起以后迅速集中，可收工回到酒店时，那种疲惫不再像二十出头时一样睡一觉就完全消失。";let p=["二月后半段的上海没有给剧组太多戏剧性的天气。大部分日子只是阴、湿、风从楼与楼之间穿过去。田曦薇逐渐习惯从酒店地下车库直接进入一天的工作，也逐渐发现，所谓‘进入角色’并不是每天都发生一次明显的开关。更多时候，周望是在很多重复动作里慢慢长出来的：翻文件的方式、听别人说话时不立刻回应的两秒、还有疲惫以后反而更少解释自己的习惯。","开机的新鲜感过去以后，剧组终于显出一部三个月项目真正的样子。没有每天值得纪念的节点，也没有每一场戏都能让人产生突破感。更多时候只是同一条走廊拍第三遍、凌晨回酒店以后发现明天仍然六点起。田曦薇却在这种重复里越来越确定，角色不是靠一次漂亮发挥建立的，而是靠演员愿不愿意把那些不起眼的日子也认真过完。","这十五天里没有所谓命运转折。真正变化的是一些很细的东西：她开始更少在拍完以后立刻问导演‘可以吗’，也开始允许某些关系停在没有答案的位置。工作和私人生活都没有突然向前跨一步，却像潮水一样一点点改变边界。等她意识到的时候，原来的岸线已经不是完全相同的形状。"] ;return p[state.turnNo%p.length]}
function pickAmbient(){let p=content.ambient.filter(x=>!state.usedEvents.includes(x.id));if(!p.length)return null;return weighted(p)}
function messageHooks(){let order=["wang","zhang","song","hou","chengzhi","mom","atao","chengman"],a=[];for(const id of order){let th=state.current.messages[id];if(th?.hooks?.length)a.push(...th.hooks)}return a.slice(0,2)}
function closingParagraphs(hooks){let a="到这个回合真正结束时，她并没有一种‘完成了很多事情’的满足。越是进入稳定阶段，生活越不像任务列表。工作决定会在几周以后才显出结果，一句消息可能什么都没有改变，也可能只是替某段关系留下一个以后能够继续的接口。她开始接受这种没有即时反馈的时间。";let r=hooks.find(x=>["wang","zhang","song","hou"].includes(x.id)),b;if(r){let n=person(r.id).name;if(r.tone==="bold")b=`真正让她在睡前多想了几分钟的，是自己对${n}那句比平时更往前一点的回复。她没有急着判断那是不是所谓‘主动’，也没有为这种变化寻找理由。成年人的关系很少因为一句话立刻改名，但一句话可以让两个人下一次见面时，不再完全站在原来的位置。`;else if(r.tone==="warm")b=`至于${n}，这半个月的联系仍然称不上频繁。田曦薇反而因为这种低频而更能感觉到每一次对话的质地。她没有把普通关心翻译成暧昧，也没有再像以前那样自动把所有可能性都归回‘只是熟人’。先让事情保持它本来的样子，对现在的她来说已经足够。`;else b=`${n}的消息没有把关系推进到任何需要定义的位置。她仍然可以很自然地开玩笑、结束对话、继续工作。只是某些旧有的分类不再像以前那么牢固。她不急着整理，因为真正值得留下的关系，本来就不应该只靠她一个人在脑子里完成。`}else b="私人关系这一边反而很安静。没有谁因为她处在一部新戏里就自动靠近，也没有所谓‘候选人’轮流出现。田曦薇喜欢这种空白。它让每一次真正发生的联系都有原因，也让没有联系的时候仍然像正常生活，而不是剧情系统忘记发放事件。";return[a,b]}
function buildStory(amb){let ce=content.career.find(x=>x.id===state.current.career.id),cc=ce.choices[state.current.career.choice],hooks=messageHooks(),pars=[openingParagraph()];pars.push(...(cc.narrative||[cc.result]));if(amb)pars.push(...(amb.narrative||[amb.text]));for(const h of hooks)pars.push(h.story);pars.push(state.current.life.text);if(state.current.explore)pars.push(state.current.explore.story||state.current.explore.text);else pars.push("这个月的城市探索没有被刻意塞进行程。几次收工以后她都想过出去走走，最后还是回了酒店。田曦薇没有因此把这半个月判断成‘没有生活’。有时候真正的生活只是按时洗完澡、把第二天要穿的衣服放好，再在睡前看十分钟完全和工作无关的东西。");pars.push(...closingParagraphs(hooks));return{title:(amb&&amb.chapter)||ce.chapter||ce.title,pars}}
function settle(){if(!canSettle())return toast("还有必选事项没有完成");let amb=pickAmbient();if(amb){delta(amb.delta);if(amb.special&&!state.current.tags.includes(amb.special))state.current.tags.push(amb.special);(amb.tags||[]).forEach(t=>{if(!state.current.tags.includes(t))state.current.tags.push(t)});state.usedEvents.push(amb.id)}let ce=content.career.find(x=>x.id===state.current.career.id),story=buildStory(amb);if(!state.usedCareer.includes(ce.id))state.usedCareer.push(ce.id);state.contextTags=[...new Set([...(state.contextTags||[]),...state.current.tags])];let statChanges={};for(const[k,v]of Object.entries(state.stats)){let d=v-(state.current.startStats[k]||0);if(d)statChanges[k]=d}let relChanges={};for(const[id,r]of Object.entries(state.relations)){let d=(r.score||0)-(state.current.startRelations[id]||0);if(d)relChanges[id]=d}let result={turn:state.turnNo,title:story.title,meta:`${state.turnStart}—${turnEnd()} · ${state.city}`,story:story.pars,career:ce.title,ambient:amb?[amb.chapter||amb.title]:[],statChanges,relChanges};state.history.push({turn:result.turn,title:result.title,meta:result.meta,summary:story.pars.slice(0,2).join("").slice(0,420)});state.last=result;state.turnNo++;state.turnStart=nextStart();state.current=null;save();tab="settle";render()}
function check(t,d,done,opt=false){return `<div class="check"><span class="mark ${done?"done":""}">${done?"✓":"·"}</span><span><b>${t}</b><small>${d}</small></span><span class="status">${opt?"可选":done?"完成":"待办"}</span></div>`}
function home(){ensure();return `<div class="hero"><div class="heroText"><small>TURN ${state.turnNo} · ${state.turnStart}—${turnEnd().slice(5)} · ${state.city}</small><h2>她的黄金时代</h2><p>人生不是一张要填满的通告单。真正改变一个人的，往往是那些当时看起来并不起眼的选择。</p></div></div><div class="row3"><div class="pill"><small>年龄</small><strong>${age()} 岁</strong></div><div class="pill"><small>项目</small><strong>七楼以南</strong></div><div class="pill"><small>历史</small><strong>${state.history.length} 回合</strong></div></div><div class="special"><b>V3.1 · 文字剧情优先</b><p>选择只是入口。结算会自动补足场景、上下文、心理、关系与额外剧情事件，组成完整章节，而不是流水账。</p></div><div class="section"><h3>本回合</h3><span>完成后阅读章节</span></div><div class="card progress">${check("私人消息",`${Object.values(state.current.messages).filter(x=>x.done).length}/${Object.keys(state.current.messages).length} 段已处理`,msgsDone())}${check("片场 / 事业",state.current.career.choice!==null?"选择已锁定":"属性会影响可选方案",state.current.career.choice!==null)}${check("生活安排",state.current.life?state.current.life.title:"本回合一次",!!state.current.life)}${check("城市探索",state.current.explore?state.current.explore.title:(state.usedExplore[month()]?"本月已使用":"本月可选一次"),!!state.current.explore,true)}${check("章节生成",canSettle()?"可以进入本回合正文":"完成必选事项后开放",false)}</div><button class="primary" style="margin-top:11px" ${canSettle()?"":"disabled"} data-a="settle">结束15天 · 阅读本回合剧情</button><div class="grid2" style="margin-top:10px"><button class="shortcut" data-a="tab:messages"><span class="sym">✉</span><b>消息</b><small>独立语气，不重复原文</small></button><button class="shortcut" data-a="tab:career"><span class="sym">⌘</span><b>片场 / 事业</b><small>能力决定你能怎么解决问题</small></button><button class="shortcut" data-a="sub:life"><span class="sym">✦</span><b>生活</b><small>进入最终正文</small></button><button class="shortcut" data-a="sub:explore"><span class="sym">⌖</span><b>探索</b><small>每月一次具体地点</small></button></div>`}
function grow(){ensure();let lives=[["rest","完整休息","真正空出一天。"],["exercise","运动恢复","轻力量、拉伸和恢复。"],["read","观影阅读","离开角色一晚。"],["voice","台词训练","声音与语言训练。"],["care","状态管理","皮肤、体态和衣橱。"],["social","小范围朋友局","安全、正常的多人社交。"]],ex=content.explore[state.city]||[];return `<div class="seg"><button class="${sub==="stats"?"active":""}" data-a="sub:stats">属性</button><button class="${sub==="life"?"active":""}" data-a="sub:life">生活</button><button class="${sub==="explore"?"active":""}" data-a="sub:explore">探索</button></div>${sub==="stats"?`<div class="card stats">${Object.entries(state.stats).map(([k,v])=>`<div class="stat"><div class="statTop"><span>${k}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join("")}</div>`:""}${sub==="life"?(state.current.life?`<div class="card settle"><h3>${state.current.life.title}</h3><p>${state.current.life.text}</p>${Object.entries(state.current.life.delta).map(([k,v])=>`<span class="delta ${v<0?"neg":""}">${k} ${v>0?"+":""}${v}</span>`).join("")}</div>`:`<div class="choicegrid">${lives.map(x=>`<button class="choice" data-a="life:${x[0]}"><b>${x[1]}</b><p>${x[2]}</p></button>`).join("")}</div>`):""}${sub==="explore"?(state.usedExplore[month()]&&!state.current.explore?`<div class="special"><b>本月探索已经使用</b><p>下个自然月会重新开放。</p></div>`:state.current.explore?`<div class="card settle"><h3>${state.current.explore.title}</h3><p>${state.current.explore.text}</p></div>`:`<div class="choicegrid">${ex.map(e=>`<button class="choice" data-a="explore:${e.id}"><div class="meta">${e.kind} · ${e.place}</div><b>${e.title}</b><p>可能改变属性、关系，也可能只是普通地度过一段时间。</p></button>`).join("")}</div>`):""}`}
function messages(){ensure();if(openChat)return chat(openChat);return `<div class="special"><b>消息不是候选人轮流打卡</b><p>每个消息变体只使用一次。内容池耗尽以后，这个人宁可暂时不出现，也不会把同一句话重新发一遍。</p></div><div class="section"><h3>本回合联系人</h3><span>${Object.keys(state.current.messages).length} 人有消息</span></div><div class="msglist">${state.knownPeople.map(id=>{let th=state.current.messages[id],p=person(id);return `<button class="msg ${th?"":"off"}" data-a="${th?`chat:${id}`:"noop"}"><span class="avatar" style="background-image:url('${p.img}')"></span><span style="min-width:0"><h4>${p.name}</h4><p>${th?(th.done?"本回合对话已结束":th.log[0].text):"本回合没有私人消息"}</p></span><span class="right">${th?(th.done?"已结束":"新消息"):"—"}</span></button>`}).join("")}</div>`}
function chat(id){let p=person(id),th=state.current.messages[id],n=node(id);return `<div class="chathead"><button class="back" data-a="back">‹</button><span class="avatar" style="background-image:url('${p.img}')"></span><div><b>${p.name}</b><div style="font-size:9px;color:var(--muted)">${p.role} · ${relLabel(id)}</div></div></div><div class="chat">${th.log.map(m=>`<div class="bubble ${m.from==="me"?"me":"them"}">${esc(m.text)}</div>`).join("")}</div>${th.done?`<div class="end">对话到这里自然结束。下一次联系需要新的现实理由，不会自动重复。</div>`:`<div class="reply">${n.choices.map((c,i)=>{let rc=reqCheck(c.req,id);return `<button ${rc.ok?"":"disabled"} class="${c.skip?"skip":""}" data-a="reply:${id}:${i}">${esc(c.text)}${rc.ok?"":`<span class="locknote">🔒 ${rc.text}</span>`}</button>`}).join("")}</div>`}`}
function careerView(){ensure();let e=content.career.find(x=>x.id===state.current.career.id),i=state.current.career.choice;return `<div class="special"><b>能力真正改变选择</b><p>表演理解、台词、共情、事业判断和人物关系会解锁不同的处理方式。不是所有选项永远都能选。</p></div><div class="section"><h3>${e.title}</h3><span>${state.project}</span></div><div class="card settle"><p>${e.desc}</p></div>${i!==null?`<div class="card settle" style="margin-top:10px"><h3>选择已锁定</h3><p>${e.choices[i].result}</p></div>`:`<div class="choicegrid" style="margin-top:10px">${e.choices.map((c,j)=>{let rc=reqCheck(c.req);return `<button class="choice" ${rc.ok?"":"disabled"} data-a="career:${j}"><b>${c.text}</b><p>${c.result}</p>${rc.ok?"":`<span class="require">🔒 ${rc.text}</span>`}</button>`}).join("")}</div>`}`}
function relations(){return `<div class="special"><b>关系不是一条公开进度条</b><p>后台关系深度会影响可用回复和后续事件；前台只显示关系质地。人物照片已直接嵌入主程序。</p></div><div class="people" style="margin-top:10px">${state.knownPeople.map(id=>{let p=person(id);return `<button class="person" data-a="rel:${id}"><div class="portrait" style="background-image:url('${p.img}')"></div><div class="body"><h4>${p.name}</h4><span class="tag">${p.role}</span><p>${p.voice}</p><div class="rel">${relLabel(id)}</div></div></button>`}).join("")}</div>`}
function settleView(){let r=state.last;if(!r){tab="home";return home()}let ds=Object.entries(r.statChanges||{}).map(([k,v])=>`<span class="delta ${v<0?"neg":""}">${k} ${v>0?"+":""}${v}</span>`).join("");return `<div class="chapterCover"><small>TURN ${r.turn} · ${r.meta}</small><h2>${r.title}</h2><p>本回合完整剧情</p></div><article class="prose">${r.story.map(p=>`<p>${p}</p>`).join("")}</article><div class="card settle"><h3>回合余波</h3><p>${ds||"属性没有明显变化"}</p>${Object.entries(r.relChanges||{}).map(([id,v])=>`<span class="delta">${person(id).name}关系 ${v>0?"+":""}${v}</span>`).join("")}<button class="primary" style="margin-top:13px" data-a="next">进入下一回合</button></div><div class="section"><h3>最近章节</h3><span>${state.history.length} 回合</span></div>${state.history.slice(-4).reverse().map(h=>`<div class="card history"><h4>第${h.turn}回合 · ${h.title}</h4><p>${h.meta}</p><p>${h.summary}</p></div>`).join("")}`}
function settings(){modal(`<h3>V3.1 · 文学剧情离线版</h3><p>人物头像已经压缩并直接嵌进 index.html，不再依赖 portraits 文件夹，因此不会再因为 GitHub 文件夹上传失败而空白。</p><p>消息采用唯一ID：发过的原文不会再次出现。高属性和高关系会解锁额外选项。</p><button class="secondary" style="width:100%" id="copySave">复制存档备份</button><div class="divider"></div><p>当前内容包：${content.title}<br>${content.version}</p>`);setTimeout(()=>{document.getElementById("copySave").onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(state));toast("存档已复制")}},0)}
function relationModal(id){let p=person(id),r=state.relations[id]||{notes:[]};modal(`<div style="height:230px;border-radius:20px;background:url('${p.img}') center 20%/cover"></div><h3 style="margin-top:12px">${p.name}</h3><p><b>${p.role}</b> · ${relLabel(id)}</p><p>${p.voice}</p><div class="divider"></div>${(r.notes||[]).map(x=>`<p>· ${esc(x)}</p>`).join("")}`)}
function modal(x){document.getElementById("modalroot").innerHTML=`<div class="modalbg" id="bg"><div class="modal">${x}<div class="modalrow"><button class="secondary" id="close">关闭</button></div></div></div>`;document.getElementById("close").onclick=closeModal;document.getElementById("bg").onclick=e=>{if(e.target.id==="bg")closeModal()}}function closeModal(){document.getElementById("modalroot").innerHTML=""}
function bind(){document.querySelectorAll("[data-a]").forEach(el=>el.onclick=()=>act(el.dataset.a));document.querySelectorAll(".bottom button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;openChat=null;render()});document.getElementById("settings").onclick=settings}
function act(a){if(a==="noop")return;if(a.startsWith("tab:")){tab=a.split(":")[1];render();return}if(a.startsWith("sub:")){tab="grow";sub=a.split(":")[1];render();return}if(a.startsWith("chat:")){openChat=a.split(":")[1];render();return}if(a==="back"){openChat=null;render();return}if(a.startsWith("reply:")){let[,id,i]=a.split(":");reply(id,+i);return}if(a.startsWith("life:")){life(a.split(":")[1]);return}if(a.startsWith("explore:")){explore(a.split(":")[1]);return}if(a.startsWith("career:")){career(+a.split(":")[1]);return}if(a.startsWith("rel:")){relationModal(a.split(":")[1]);return}if(a==="settle"){settle();return}if(a==="next"){state.last=null;tab="home";ensure();save();render();return}}
function render(){document.querySelectorAll(".bottom button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));let T={home:"她的黄金时代",grow:"个人养成",messages:"私人消息",career:"事业",relations:"人物关系",settle:"本回合剧情"};document.getElementById("title").textContent=T[tab]||"她的黄金时代";let v=document.getElementById("view");if(tab==="home")v.innerHTML=home();if(tab==="grow")v.innerHTML=grow();if(tab==="messages")v.innerHTML=messages();if(tab==="career")v.innerHTML=careerView();if(tab==="relations")v.innerHTML=relations();if(tab==="settle")v.innerHTML=settleView();bind()}
ensure();render();
</script><script>if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));</script></body></html>
