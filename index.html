   const min=id==="wang"?18:22;
   return (state.relations[id]?.score||0)>=min&&!romanceEnsure(id).ended&&state.turnNo-(state.callLastTurn[id]??-99)>=3
 });
 if(!ids.length)return;
 const roll=hashCode(`${state.turnStart}:call`)%100;
 if(roll>=48)return;
 ids.sort((a,b)=>(state.relations[b]?.score||0)-(state.relations[a]?.score||0));
 const id=ids[hashCode(`${state.turnNo}:caller`)%Math.min(ids.length,2)];
 const pool=(CALL_BANK[id]||[]).filter(c=>!state.usedCalls.includes(c.id));
 if(!pool.length)return;

 state.current.callEvent={...c,personId:id,status:"ringing",step:0,log:[],outcome:"",choicePath:[]};
 state.usedCalls.push(c.id);state.usedCalls=state.usedCalls.slice(-100);

function careerEligibleFor(e,dateStr){
 const t=timelineFor(dateStr);
 if(e.phase&&e.phase!==t.phase)return false;
 if(e.project&&e.project!==t.project)return false;
 if(e.start&&dateStr<e.start)return false;
 if(e.end&&dateStr>e.end)return false;
 return true
}
function chooseCareerSeedFor(dateStr){

   .filter(e=>!state.usedCareer.includes(e.id))
   .filter(e=>e.id!==state.current?.career?.id);
 if(!pool.length)return null;
 const currentCat=careerDef()?.category||"";
 let diverse=pool.filter(e=>(e.category||"")!==currentCat);
 if(diverse.length)pool=diverse;
 let idx=(state.turnNo*7+dateStr.length)%pool.length;

}

function genMessages(){
 let options=[];
 for(const id of state.knownPeople){
  let pool=content.messages[id]||[],gap=state.turnNo-(state.relations[id]?.last??-99);
  for(const t of pool){
   if((t.gap||0)>gap)continue;
   if(t.project&&t.project!==state.project)continue;
   if(t.phase&&t.phase!==state.phase)continue;
   if(t.start&&state.turnStart<t.start)continue;
   if(t.end&&state.turnStart>t.end)continue;
   if(t.requires&&!contextHas(t.requires))continue;
   if(state.usedMessages.includes(t.id))continue;
   const incoming=t.nodes?.n1?.incoming||"";
   if(!topicCooldownOk(id,incoming,["chengman","atao","mom"].includes(id)?3:5))continue;
   if(messageTooSimilar(id,incoming))continue;
   let w=t.weight||1;
   if(id==="zhang")w*=.35;if(id==="song")w*=.45;if(id==="hou")w*=.3;
   options.push({id,t,weight:w})
  }
 }
 let chosen=[];
 while(options.length&&chosen.length<3){let x=weighted(options);chosen.push(x);options=options.filter(y=>y.id!==x.id)}
 for(const x of chosen){
  let practical=["chengman","atao","mom","chengzhi"].includes(x.id);
  if(practical||Math.random()<.62)state.current.messages[x.id]={tree:x.t.id,node:"n1",done:false,n:0,log:[{from:"npc",text:x.t.nodes.n1.incoming}],hooks:[]}
 }
 if(!Object.keys(state.current.messages).length){
  for(const id of ["atao","chengman","mom"]){
   let t=(content.messages[id]||[]).find(x=>!state.usedMessages.includes(x.id)&&(!x.phase||x.phase===state.phase)&&((x.gap||0)<=state.turnNo-(state.relations[id]?.last??-99))&&topicCooldownOk(id,x.nodes?.n1?.incoming||"",2)&&!messageTooSimilar(id,x.nodes?.n1?.incoming||""));
   if(t){state.current.messages[id]={tree:t.id,node:"n1",done:false,n:0,log:[{from:"npc",text:t.nodes.n1.incoming}],hooks:[]};break}
  }
 }
}

function deliverPendingReply(id){

 const p=th.pendingReply;

 if(p.reply)th.log.push({from:"npc",text:p.reply});
 if(p.sticker)th.log.push({from:"npc",text:p.sticker,type:"sticker"});
 th.n=(th.n||0)+1;
 if(p.nextMode==="explicit"){
   th.synthetic=null;th.node=p.nextNode;
   const nxt=tree(id)?.nodes?.[p.nextNode];
   if(nxt?.incoming)th.log.push({from:"npc",text:nxt.incoming})
 }else if(p.nextMode==="synthetic"&&p.synthetic){
   th.synthetic=p.synthetic;

   finishMessage(id,th)

}

function reply(id,i){

  finishMessage(id,th);save();render();return
 }
 th.log.push({from:"me",text:c.text});
 if(c.rel)relDelta({[id]:c.rel});
 messageRomance(id,c.tone||"",c.rel||0);
 if(c.story)th.hooks.push({story:c.story,tone:c.tone||"",id});
 let nextMode="finish",nextNode=null,synthetic=null;
 if(c.next&&((th.n||0)+1)<10&&tree(id)?.nodes?.[c.next]){
   nextMode="explicit";nextNode=c.next
 }else{
   const maxAuto=["wang","zhang","song","hou","chengzhi"].includes(id)?2:1;
   if(!c.finish&&(th.autoStage||0)<maxAuto&&((th.n||0)+1)<10){
     let sn=makeContinuationNode(id,th,c);
     if(sn){nextMode="synthetic";synthetic=sn;th.autoStage=(th.autoStage||0)+1}
   }
 }
 const delay=typingDelayFor(id,c.reply||"");
 th.typing=true;
 th.pendingReply={
   reply:c.reply||"",sticker:stickerFor(id,c.tone||""),
   nextMode,nextNode,synthetic,
   dueAt:Date.now()+delay
 };
 save();render();schedulePendingReply(id)
}

function rollActivityEncounter(kind,opt){
 // 先尝试明星库人物；原创长期NPC从V3.6起不再主动生成。
 if(Math.random()<0.68){
   let se=chooseStarEncounter(kind);
   if(se){
     state.activityEncounterHistory.push(se.id);
     delta(se.delta);relDelta(se.rel);
     activateStar(se.personId,"在生活/探索中自然遇见。");
     return clone(se)
   }
 }
 let candidates=ACTIVITY_ENCOUNTERS.filter(e=>!["enc_linli","enc_xuzhiqiu","enc_suyuan"].includes(e.id)).filter(e=>e.kind.includes(kind)&&!state.activityEncounterHistory.includes(e.id));
 const rid=opt?.romanceId;
 if(rid&&Math.random()<0.7){
   const name=person(rid).name;
   const rel=state.relations[rid]?.score||0;
   const e={id:`enc_${rid}_${state.turnNo}`,kind:[kind],weight:5,delta:{},rel:{[rid]:rel>=35?2:1},personId:rid,
    narrative:[
     `空出来的时间最后真的和${name}发生了交集。两边通告都不稳定，直到当天傍晚才确认能见面，地点也选得很普通。`,
     `这并不是一次自动升温的“奖励约会”。真正相处以后，田曦薇反而更清楚感觉到两个人之间现在处在什么位置：有些话比消息里容易说，有些沉默也比消息里更难躲。`
    ]};
   candidates=[e,...candidates]
 }
 // 约45%出现随机事件；主动给某人留时间时概率更高。
 const chance=rid?0.78:0.45;
 if(!candidates.length||Math.random()>chance)return null;
 let e=weighted(candidates.map(x=>({...x,weight:x.weight||1})));
 if(!String(e.id).startsWith("enc_"+(rid||"__")))state.activityEncounterHistory.push(e.id);
 delta(e.delta);relDelta(e.rel);
 if(e.personId&&["linli","xuzhiqiu","suyuan"].includes(e.personId))addKnownPerson(e.personId);
 return clone(e)
}

 return"creative"
}

  `她也有状态很一般的时候。镜头里的自己没有犯错，可就是少了一点活气。导演说再来一条，她没有追问“哪里不好”，只是走回起点。第二遍开拍前，她听见场边有人把保温杯碰倒，短短一声响让注意力突然落回现实。那一条反而松了下来。表演有时就是这样，越想控制越容易把自己关进去。`,
  `在${city}待久以后，她开始有固定的小习惯。早班会在车上喝第一口咖啡，夜戏结束一定先卸耳环，回酒店以后如果第二天不是六点开工，就给自己十分钟什么都不做。没有人会把这些写进人物采访，可一个人的几年生活真正是由这些重复动作构成的。`,
  `有一次她和程曼聊到“上升期”这个词。田曦薇说：“听起来像只要停一下就会掉下去。”程曼把电脑合上：“行业当然希望你这么想。这样你才会什么都接。”她沉默了一会儿。事业心并不等于永远加速，真正困难的是在所有人都告诉你趁热的时候，仍然保留判断什么值得继续。`,
  `家里偶尔也会在最忙的时候闯进来。妈妈发来一张很普通的照片，可能是一盘菜，也可能是爸爸新买了什么奇怪的小东西。田曦薇经常隔一两个小时才回，却从不会觉得这种迟到的对话失效。家庭和工作不同，它很少要求她在某一个时间点给出最佳表现。`,
  `剧组里的女性关系慢慢变得具体。不是所有人都会成为朋友，也不是每一次女性友谊都必须靠分享秘密证明。有时候只是化妆师在她连续早班时顺手留了一块饼干，或者某个女演员在被网上骂得最凶的那天照常来现场，把戏演完以后一起吃了一顿饭。田曦薇越来越珍惜这种不需要宣言的同盟感。`,
  `她开始更少在收工以后复盘自己“有没有表现好”，更多去想整场戏到底有没有成立。两种问题只差几个字，背后的重心却完全不同。前者把镜头里所有东西都拉回演员本人，后者逼着她承认，一场戏从来不是一个人的作品。`,
  `有天晚上她站在酒店窗前，看见下面的车流还在移动。${project}、关系、下一份工作、公众评价，这些事情如果同时放在脑子里，会显得每一件都很大。她后来干脆只决定一件事：先去洗澡。生活很多时候不是想通以后才继续，而是身体先把今天结束，明天再处理明天。`,
  `她并没有因为年龄增长就突然不在意评价。看到很刻薄的评论仍然会不舒服，被误解也仍然会想解释。区别只是，她越来越能判断这种不舒服值不值得占用第二天。某些声音应该回应，某些声音只需要让它从屏幕上划过去。`,
  `在一次等灯的时候，田曦薇忽然问阿桃：“你觉得我这几年变化大吗？”阿桃认真想了几秒：“你现在比较会说不。”她笑：“就这？”阿桃又补一句：“还有，说不以后不会回房间自责两个小时了。”这次她真的被逗笑。成长被旁人说出来的时候，往往比自己总结得更具体。`,
  `片场有个年轻工作人员第一次独立负责一件事，出了一个不大的错，一直道歉。田曦薇看着她，想起自己刚入行时也会把任何错误都理解成人格问题。她只说：“修好就行，下次记住。”对方愣了一下。她忽然意识到，所谓行业前辈并不是有一天被谁正式授予的身份，而是在你已经开始决定怎样对待后来的人时悄悄发生。`,
  `这十五天并没有持续保持一种情绪。她会在一场好戏以后很满足，也会因为一句不合时宜的话瞬间烦躁；会想谈恋爱，又会在看到工作排期时觉得独处最省事。矛盾没有因为成熟消失。成熟更像是允许这些相反的念头同时存在，不急着挑一个出来代表全部的自己。`,
  `有一天下午换景，摄影棚的门一直开着，外面的风把桌上几张废通告吹到地上。阿桃蹲下去捡，田曦薇也顺手弯腰。旁边有人赶紧说“我来”，她已经把最后一张递过去了。那一瞬间没发生任何值得记住的事，却让她想到，人被长期照顾以后很容易忘记自己仍然可以做最普通的动作。她不想把“有人替我处理”慢慢活成“这些本来就不该由我处理”。`,
  `中途有个短暂的空档，她去洗手间时遇到同组女演员在镜子前补口红。两个人并不算特别熟，只聊了几句昨晚的戏。对方突然说：“我最近一看到自己的热搜就烦。”田曦薇看着镜子笑了笑：“那先别看。”这句话说出来容易，真正做到却很难。她们都知道，所以谁也没有把它包装成建议，只把这个共同的烦恼放在洗手台边，几分钟后各自回去开工。`,
  `晚上有一场戏拍到很晚，现场安静得只剩机器移动的声音。导演喊卡以后没人立刻讲话，大家像同时从一个很集中的梦里醒过来。田曦薇站在原地缓了几秒，才听见远处工作人员问盒饭还有没有。她忽然很喜欢这种落差：镜头里刚刚还是人物人生里很重的一刻，镜头外下一秒最重要的问题就是谁还没吃饭。职业因此被拉回现实，也因此没有那么容易把人吞进去。`,
  `程曼有次在车上问她，最近是不是比以前更少刷自己的相关内容。田曦薇说：“不是少刷，是刷到了也比较能关掉。”程曼点点头，没有夸她“心态成熟”。这件事也确实没那么励志。她还是会被一些话刺到，只是终于不再觉得每一种误解都必须靠本人亲自纠正。公众想象永远会比真实生活简单，而她要做的是别为了修正想象，把真实生活也交出去。`,
  `一个早班结束得意外顺利，下午多出四十分钟。她没有睡，也没有看手机，只坐在保姆车里把窗帘拉开一点。外面工作人员推着器材箱经过，有人在路边打电话吵架，还有个女孩捧着两杯奶茶一路小跑。田曦薇忽然发现自己很久没有这样只看别人生活。演员工作要求她不断观察人，可当观察变成任务以后，也会失去最初那种纯粹好奇。她索性什么都不记，让那四十分钟什么成果也没有。`,
  `她也不是每一次都做对。有一场戏收工以后，她在车里越想越觉得自己处理得太满，第二天主动去找导演提能不能补一条。导演没同意，说：“你现在只是因为离那场戏太近。”她当时有点不服，三天后回看素材，却发现对方是对的。经验增加以后最难接受的一件事，是你仍然会判断失误；区别只是你开始知道，失误不需要立刻靠另一个动作补救。`,
  `剧组里有人过生日，蛋糕是在午休最后十分钟推进来的。大家唱得很敷衍，寿星本人笑得停不下来。田曦薇被塞了一小块奶油，刚吃两口就听见场务喊准备。她把叉子放回盘子里，和所有人一起站起来。这样的生日和普通人的聚会很不一样，却也没有因此少一点真实。工作会打断生活，生活也总能从工作缝隙里冒出来。`,
  `她开始留意自己说“没事”的次数。有些真的没事，有些只是懒得解释，还有些其实是希望别人不要继续问。以前她把这些情况混在一起，现在慢慢分得更清楚。面对亲近的人，偶尔承认“我今天确实有点烦”并不会让关系变沉；面对不需要知道的人，也不必因为礼貌把所有情绪交代完整。边界不是把人挡在外面，而是决定哪一种真实应该给谁看。`,
  `有次收工以后，司机走了一条和平时不同的路。田曦薇抬头时才发现车窗外完全陌生，问了一句是不是走错了。司机说前面堵，绕一下。她“哦”了一声，没有再低头，索性一路看着陌生街区过去。城市每天都在她身边，却常常只作为从A点到B点的距离存在。那晚她第一次记住路边一家还亮着灯的小花店，后来也没有特意去，只知道它在那里。`,
  `这一阶段她和父母的电话也变短了。不是关系疏远，而是双方都越来越不需要靠长时间通话证明亲近。妈妈会说今天家里做了什么菜，爸爸在旁边插一句完全无关的话，她则讲一个片场里很小的笑话。十分钟以后自然挂掉。田曦薇有时会在通话结束后想，成年人的家大概就是这样：不再要求你时时在场，却一直给你留着可以回去的那一部分。`
 ]
}
function chapterCharCount(pars){return pars.join("").replace(/\s/g,"").length}
function foreshadowCareerScene(nextEvent,nextDate){
 if(!nextEvent)return[];
 let t=timelineFor(nextDate),fam=careerFamily(nextEvent),intro="";
 if(fam==="set")intro=`临收工时，副导演把下一阶段的通告先发了出来，${nextEvent.title}被写在最上面。`;
 else if(fam==="offer")intro=`回酒店前，程曼没有把手里的资料带走。她说下一次需要正式谈的是“${nextEvent.title}”。`;
 else if(fam==="publicity")intro=`宣传统筹临走时提了一句，下个回合还有一项尚未最终确认的安排：${nextEvent.title}。`;
 else if(fam==="award")intro=`程曼把一个还没有最终确认的名单压在文件夹最下面，告诉她下一次需要面对的是“${nextEvent.title}”。`;
 else if(fam==="body")intro=`程曼在新的日程表上画了一个圈，说下一阶段先处理“${nextEvent.title}”，别等身体替她决定。`;
 else intro=`新的通告发下来时，有一项尚未真正展开的事已经先出现了名字：${nextEvent.title}。`;
 return[
  `${intro}田曦薇当时没有讨论选项，也没有立刻给答案。${nextEvent.desc||""}这件事先以一个未完成的问题留在了这一章里，而不是等到下一回合才凭空出现。`,
  `“先放着。”她对程曼说。对方点头，把文件收回去。她知道下一次真正坐下来处理时，自己会需要作出选择；可故事的顺序应该是先遇见问题，再决定怎么走，而不是菜单先于生活出现。`
 ]
}
function timelineTransitionScene(nextDate){
 const a=timelineFor(state.turnStart),b=timelineFor(nextDate);
 if(a.phase===b.phase)return[];
 if(state.introducedTimelineIds.includes(b.id))return[];
 state.introducedTimelineIds.push(b.id);
 if(b.project&&b.project!==a.project){
   return[
    `这一章快结束时，真正属于下一阶段的消息才落地。程曼把时间表转过来：“${b.project}那边把时间定了，下一段主要在${b.city}。”田曦薇看着那个项目名字，没有把它当成凭空出现的新人生。项目从被提到、被了解，到终于写进日程，本来就应该经过时间。`,
    `她问了两个很实际的问题：第一天什么时候到，前面能不能留出完整的休息。程曼一项项回答。没有签约仪式，也没有背景音乐。一个阶段就是这样结束，另一个阶段也这样开始——先从一句具体的时间、一个城市和需要收进行李箱里的东西进入生活。`
   ]
 }
 return[
  `新的时间表在这一章末尾先露出一角。下一阶段会从“${a.mode}”转到“${b.mode}”，城市也会变成${b.city}。田曦薇没有立刻对这种变化产生什么宏大感受，只开始处理最现实的问题：哪些行李要寄走，哪些工作需要在离开前收尾。`,
  `她越来越喜欢这种过渡被提前看见的感觉。人生当然会有突然发生的事，可大部分工作变化其实都有前兆。下一章真正开始时，读者和她都已经知道门后面大概是什么，而不是等UI忽然告诉她换了一个项目。`
 ]
}
function foreshadowRomanceScene(seed){
 if(!seed)return[];
 if(seed.type==="overlap")return[
  `私人生活里也有一件事没有在这一章解决。两个已经被她分别放进“不能随便处理”的关系，在下一周留下了彼此可能撞见的时间痕迹。程曼并不知道全部，只随口问了一句：“这两个晚上都要给你空着？”田曦薇停了半秒，说先别动。`,
  `她第一次意识到，秘密真正危险的时候并不是被拍到，而是一个人为了维持不同版本的生活，开始需要别人无意中替她配合。这个问题还没有爆开，但它已经存在。`
 ];
 let id=seed.personId,e=(content.romanceEvents[id]||[]).find(x=>x.id===seed.eventId),n=person(id).name;
 const map={
  wang:`旧友群在这一章快结束时又热闹了一次。有人提到${n}过几天可能也会在她所在的城市，话题很快被别的消息盖过去。田曦薇没有私下问，却记住了那个时间。`,
  zhang:`程曼核对活动名单时顺口提到${n}的团队也在同一个区域。田曦薇只“嗯”了一声，没有问会不会见到。越是可能发生的碰面，越不需要提前把它想得像剧情。`,
  song:`品牌方发来的下一轮名单里出现了${n}。田曦薇扫过去时没有停太久，只发现自己已经能很快从一整页名字里认出他的那一行。`,
  hou:`阿桃给她听一段最近很火的新歌，聊到一半说${n}下周也有音乐相关工作。田曦薇没有接着问，只把那首歌从头听完。`
 };
 return[
  map[id]||`关于${n}，下一次真正的见面或对话还没有发生，只是现实里已经出现了一个很小的交叉点。`,
  `这并不是下一段感情剧情本身，只是它的前因。等真正需要作出选择时，这件事已经在上一章里存在过，而不是系统临时把一个人推到她面前。`
 ]
}
function chooseNextSeeds(){
 const nd=nextStart();
 let nextCareer=chooseCareerSeedFor(nd);
 state.pendingCareer=nextCareer?clone(nextCareer):null;
 state.pendingCareerIntro=nextCareer?`${nextCareer.title}已经在上一章末尾被提及。`:"";
 if(nextCareer&&!state.introducedCareerIds.includes(nextCareer.id))state.introducedCareerIds.push(nextCareer.id);
 let nextRom=chooseNextRomanceSeed();
 state.pendingRomance=nextRom?clone(nextRom):null;
 if(nextRom?.eventId&&!state.introducedRomanceIds.includes(nextRom.eventId))state.introducedRomanceIds.push(nextRom.eventId);
 let nextStar=chooseNextStarOpportunity();
 state.pendingStarEvent=nextStar?clone(nextStar):null;
 state.pendingStarIntro=nextStar?`${nextStar.title}已经在上一章末尾先出现了现实前因。`:"";
 return{nextCareer,nextRom,nextStar,nextDate:nd}
}

function noExploreParagraph(){
 const p=[
  "这个月的探索没有被刻意塞进行程。几次收工以后她都想过出去走走，最后还是回了住处。田曦薇没有因此把这半个月判断成“没有生活”。有时候真正的生活只是洗完澡、把第二天要穿的衣服放好，再看十分钟和工作无关的东西。",
  `她这个月没有专门去${state.city}任何一个地方。城市仍然从车窗外经过，咖啡店、路口和便利店慢慢变成熟悉背景。不是每个月都需要把“生活”安排成一个可选活动。`,
  "空闲时间最终没有变成一场探索。她本来已经换好衣服，又在门口决定不去了。以前会觉得浪费一个下午，现在只觉得如果身体想留在房间里，那也可以是答案。",
  "这个月没有新增地图上的坐标。田曦薇反而在住处附近找到一家能稳定吃到热饭的小店。旅行式的新鲜感没有发生，长期生活式的熟悉感却多了一点。",
  "她想出去，又临时遇到下雨，最后把计划取消。没有替换成室内打卡，也没有因此补偿性安排别的活动。计划被取消以后留下的空白，就真的空着。",
  "探索次数留到了月底也没有用掉。她越来越能接受，不是所有可用机会都必须兑现；有些选择的意义只是让自己知道，今天可以去，也可以不去。"
 ];return p[state.turnNo%p.length]
}

function buildStory(amb,seeds){
 let ce=careerDef(),cc=ce.choices[state.current.career.choice],hooks=messageHooks(),pars=[];
 pars.push(...chapterOpeningScenes());
 pars.push(...careerLeadScenes(ce));
 pars.push(...(cc.narrative||[cc.result]));
 pars.push(...careerInteractiveScenes());
 pars.push(...careerAftermathScenes(ce,cc));
 if(amb)pars.push(...expandedAmbientScenes(amb));
 let sstory=starEventStoryScenes();if(sstory.length)pars.push(...sstory);
 let rstory=expandedRomanceScenes();
 if(rstory.length)pars.push(...rstory);
 if(state.current.fadeStories?.length)pars.push(...state.current.fadeStories);
 // 把消息写成真正场景，而不是一句“某人联系了她”。
 for(const id of ["wang","zhang","song","hou","chengzhi","mom","atao","chengman"]){
   if(state.current.messages[id]?.done){
     if(state.current.romanceEvent?.personId===id)continue;
     let ms=messageScene(id); if(ms.length)pars.push(...ms)
   }
 }
 pars.push(...callStoryScenes());
 pars.push(...socialFeedStoryScenes());
 pars.push(supportingLifeScene());
 pars.push(...lifeExploreScenes());
 // 保证章节长度；补充内容仍然是当前项目中的生活场景，不是摘要句。
 let fillers=continuityFillers(),fi=0;
 while(chapterCharCount(pars)<4200&&fi<fillers.length){pars.push(fillers[fi++])}
 // 下一章所有重要事业/感情发展先在本章出现伏笔。
 pars.push(...foreshadowCareerScene(seeds.nextCareer,seeds.nextDate));
 pars.push(...timelineTransitionScene(seeds.nextDate));
 pars.push(...foreshadowRomanceScene(seeds.nextRom));
 pars.push(...foreshadowStarOpportunity(seeds.nextStar));
 // 真正的结尾不是“总结本回合”，而是把人物停在下一章前的一个生活瞬间。
 const ends=[
  `回到住处以后，田曦薇没有再复盘这十五天。她把第二天要穿的衣服搭在椅背上，关掉大灯，只留床头一盏很小的光。手机里还有没处理完的工作，下一阶段的问题也已经露出一点影子，可她没有继续往下看。今天已经足够长了。她把闹钟设好，屏幕暗下去，房间里终于只剩空调很轻的声音。`,
  `这一晚结束得没有任何仪式。她洗完澡出来，看见窗外还有车在往前走。下一回合会有新的问题等着她，某个人也许会靠近一点，某份工作也许会真正落到手里。但这些都不是现在。她把手机反扣在桌上，先让今天完整地结束。`
 ];
 pars.push(ends[state.turnNo%ends.length]);
 return{title:(state.current.romanceEvent&&romanceEventDef()?.title)||(amb&&amb.chapter)||ce.chapter||ce.title,pars,charCount:chapterCharCount(pars)}
}
function settle(){
 if(!canSettle())return toast("还有必选事项没有完成");
 try{
 driftRomance();
 let amb=pickAmbient();
 if(amb){
  delta(amb.delta);relDelta(amb.rel);

 };

function contentDuplicateAudit(){
 const exact={career:0,messageIncoming:0,messageReply:0,romanceTitle:0};
 const countDup=arr=>{let m=new Map(),n=0;for(const x of arr){let k=compactNorm(x);if(!k)continue;m.set(k,(m.get(k)||0)+1)}for(const v of m.values())if(v>1)n+=v-1;return n};
 exact.career=countDup((content.career||[]).map(x=>`${x.title}|${x.desc}`));
 let ins=[],reps=[];for(const trees of Object.values(content.messages||{}))for(const t of trees)for(const n of Object.values(t.nodes||{})){ins.push(n.incoming||"");for(const c of n.choices||[])if(c.reply)reps.push(c.reply)}
 exact.messageIncoming=countDup(ins);exact.messageReply=countDup(reps);
 exact.romanceTitle=countDup(Object.values(content.romanceEvents||{}).flat().map(x=>x.title||""));
 return exact
}

function modal(x){document.getElementById("modalroot").innerHTML=`<div class="modalbg" id="bg"><div class="modal">${x}<div class="modalrow"><button class="secondary" id="close">关闭</button></div></div></div>`;document.getElementById("close").onclick=closeModal;document.getElementById("bg").onclick=e=>{if(e.target.id==="bg")closeModal()}}function closeModal(){document.getElementById("modalroot").innerHTML=""}

function act(a){if(a==="noop")return;if(a.startsWith("tab:")){tab=a.split(":")[1];if(tab==="messages"&&state.current?.callEvent&&!callComplete())msgSub="calls";openChat=null;render();window.scrollTo?.(0,0);return}if(a.startsWith("msgsub:")){msgSub=a.split(":")[1];openChat=null;render();return}if(a.startsWith("sub:")){tab="grow";sub=a.split(":")[1];openChat=null;render();window.scrollTo?.(0,0);return}if(a.startsWith("chat:")){openChat=a.split(":")[1];render();return}if(a==="back"){openChat=null;render();return}if(a.startsWith("reply:")){let[,id,i]=a.split(":");reply(id,+i);return}if(a.startsWith("sticker:")){let parts=a.split(":");userSticker(parts[1],parts.slice(2).join(":"));return}if(a.startsWith("momentlike:")){socialReact(a.slice(11),"like");return}if(a.startsWith("momentpass:")){socialReact(a.slice(11),"pass");return}if(a.startsWith("momentcomments:")){momentCommentModal(a.slice(15));return}if(a.startsWith("momentcomment:")){let parts=a.split(":");closeModal();socialReact(parts.slice(1,-1).join(":"),"comment",+parts[parts.length-1]);return}if(a.startsWith("call:")){callAction(a.split(":")[1]);return}if(a.startsWith("callstep:")){callStepChoice(+a.split(":")[1]);return}if(a.startsWith("life:")){life(a.split(":")[1]);return}if(a.startsWith("lifefollow:")){lifeFollow(+a.split(":")[1]);return}if(a.startsWith("explore:")){explore(a.split(":")[1]);return}if(a.startsWith("careerfollow:")){careerFollow(+a.split(":")[1]);return}if(a.startsWith("career:")){career(+a.split(":")[1]);return}if(a.startsWith("rel:")){relationModal(a.split(":")[1]);return}if(a.startsWith("romance:")){applyRomanceChoice(+a.split(":")[1]);return}if(a.startsWith("star:")){applyStarChoice(+a.split(":")[1]);return}if(a==="settle"){settle();return}if(a==="next"){state.last=null;tab="home";ensure();save();render();return}}

function updateNavBadges(){
 const msg=document.getElementById("badgeMessages"),car=document.getElementById("badgeCareer"),rel=document.getElementById("badgeRelations"),grow=document.getElementById("badgeGrow");
 if(!state.current)return;
 const pendingMsg=Object.values(state.current.messages||{}).filter(x=>!x.done).length+(state.current.callEvent&&!callComplete()?1:0);
 if(msg){msg.style.display=pendingMsg?"flex":"none";msg.textContent=pendingMsg>9?"9+":String(pendingMsg)}
 const careerPending=!careerSceneComplete()||!starEventComplete();
 if(car)car.style.display=careerPending?"block":"none";

 if(grow)grow.style.display=growPending?"block":"none"
}
