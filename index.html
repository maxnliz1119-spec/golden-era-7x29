  <style>
:root{
  --bg:#f6efe9; --paper:#fffaf6; --ink:#322a29; --muted:#8f7d77;
  --rose:#d98994; --rose2:#f1c8ce; --wine:#8e4d5b; --gold:#b79a6a;
  --line:rgba(104,76,67,.14); --shadow:0 14px 38px rgba(70,43,38,.11);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box} html,body{margin:0;background:linear-gradient(180deg,#efe3db,#f8f3ef 45%,#f2e7df);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
body{min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app-shell{width:min(100%,470px);min-height:100vh;margin:0 auto;background:rgba(255,250,246,.94);position:relative;box-shadow:0 0 60px rgba(62,43,37,.14);padding-bottom:calc(86px + var(--safe-bottom))}
.topbar{position:sticky;top:0;z-index:30;padding:18px 18px 12px;display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(180deg,rgba(255,250,246,.98),rgba(255,250,246,.88),rgba(255,250,246,0));backdrop-filter:blur(14px)}
.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--gold);font-weight:700}
h1{font-family:Georgia,"Songti SC",serif;font-weight:500;font-size:27px;margin:3px 0 0;letter-spacing:.02em}
.icon-btn{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:50%;width:39px;height:39px;font-size:22px;color:var(--ink)}
.view{padding:6px 16px 26px}
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,470px);height:calc(70px + var(--safe-bottom));padding:8px 11px var(--safe-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,251,248,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:40}
.nav-item{position:relative;border:0;background:transparent;color:#9b8984;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center}
.nav-item span{font-size:19px}.nav-item small{font-size:10px}.nav-item.active{color:var(--wine)}
.dot{display:none;position:absolute;top:5px;right:18px;width:7px;height:7px;background:#d84c5d;border-radius:50%}.dot.show{display:block}
.card{background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.hero{height:300px;position:relative;background-size:cover;background-position:center;border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(29,18,20,.04),rgba(29,18,20,.08) 35%,rgba(29,18,20,.78))}
.hero-content{position:absolute;inset:auto 18px 18px;color:white;z-index:2}
.hero-content .date{font-size:12px;opacity:.85;letter-spacing:.08em}.hero-content h2{font-family:Georgia,"Songti SC",serif;font-size:31px;font-weight:500;margin:5px 0 7px}.hero-content p{font-size:13px;line-height:1.65;margin:0;opacity:.94}
.status-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.status-pill{padding:12px 9px;background:#fff;border:1px solid var(--line);border-radius:17px}.status-pill b{display:block;font-size:13px}.status-pill span{font-size:10px;color:var(--muted)}
.primary{width:100%;border:0;border-radius:18px;padding:15px;background:linear-gradient(135deg,#dc8491,#b95e72);color:white;font-weight:700;box-shadow:0 10px 20px rgba(185,94,114,.23)}
.secondary{border:1px solid var(--line);background:#fffaf7;color:var(--ink);border-radius:15px;padding:12px 14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.shortcut{border:1px solid var(--line);background:#fff;border-radius:19px;padding:15px;text-align:left;min-height:94px}.shortcut .icon{font-size:22px}.shortcut b{display:block;margin-top:8px}.shortcut small{color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:22px 2px 10px}.section-head h3{font-family:Georgia,"Songti SC",serif;font-weight:500;margin:0;font-size:20px}.section-head span{font-size:11px;color:var(--muted)}
.note-card{padding:16px;background:linear-gradient(145deg,#fff,#f8ebe8);border:1px solid var(--line);border-radius:20px}.note-card p{margin:7px 0 0;line-height:1.7;font-size:13px}
.story-cover{height:215px;background-size:cover;background-position:center;border-radius:24px;position:relative;overflow:hidden}.story-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(23,15,15,.7))}.story-meta{position:absolute;bottom:16px;left:16px;right:16px;color:white;z-index:2}.story-meta small{opacity:.8}.story-meta h2{font-family:Georgia,"Songti SC",serif;margin:5px 0 0;font-weight:500}
.prose{font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;font-size:16px;line-height:2.02;letter-spacing:.015em;padding:18px 4px 6px}.prose p{margin:0 0 18px}
.choice-list{display:grid;gap:10px;margin:14px 0}.choice{width:100%;display:grid;grid-template-columns:42px 1fr 20px;align-items:center;border:1px solid rgba(180,111,123,.2);background:linear-gradient(90deg,#fff8f6,#fff);border-radius:16px;padding:10px 10px 10px 8px;text-align:left;color:var(--ink)}.choice:hover,.choice:active{transform:translateY(-1px);box-shadow:0 7px 18px rgba(111,67,76,.09)}.choice .letter{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:#df8995;color:white;font-weight:700}.choice .choice-text{font-size:13px;line-height:1.45;padding-right:4px}.choice .arrow{color:#bda39c}
.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#332a29;color:white;padding:10px 15px;border-radius:20px;font-size:12px;z-index:100;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}
.list{display:grid;gap:10px}.msg-row{display:grid;grid-template-columns:52px 1fr auto;gap:11px;align-items:center;padding:12px;border:1px solid var(--line);background:#fff;border-radius:19px}.avatar{width:52px;height:52px;border-radius:17px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}.msg-row h4{margin:0 0 4px;font-size:14px}.msg-row p{margin:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}.msg-row time{font-size:10px;color:#b5a29d}.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#d75868;color:white;font-size:10px;margin-top:5px;float:right}
.chat-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}.back{border:0;background:#fff;border-radius:12px;padding:8px 10px}.chat-area{min-height:370px;display:flex;flex-direction:column;gap:9px;padding:10px 2px}.bubble{max-width:78%;padding:11px 13px;border-radius:17px;line-height:1.5;font-size:13px}.bubble.them{align-self:flex-start;background:white;border:1px solid var(--line);border-bottom-left-radius:5px}.bubble.me{align-self:flex-end;background:#edb3bc;border-bottom-right-radius:5px}.typing{align-self:flex-start;color:var(--muted);font-size:11px;padding:3px 7px}.quick-replies{display:flex;gap:7px;overflow:auto;padding:5px 0}.quick-replies button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:11px}.composer{display:grid;grid-template-columns:1fr 48px;gap:7px;margin-top:7px}.composer input{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px;outline:none}.composer button{border:0;background:var(--wine);color:white;border-radius:15px}
.relation-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.person-card{padding:0;border:1px solid var(--line);background:white;border-radius:21px;overflow:hidden;text-align:left}.person-card .photo{height:155px;background-size:cover;background-position:center}.person-card .body{padding:12px}.person-card h4{margin:0;font-family:Georgia,"Songti SC",serif;font-size:18px}.tag{display:inline-block;margin-top:6px;border-radius:999px;padding:4px 8px;background:#f6e4e6;color:#9a5965;font-size:10px}.person-card p{font-size:11px;line-height:1.55;color:var(--muted)}
.life-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.life-card{border:1px solid var(--line);background:white;border-radius:18px;padding:16px 8px;text-align:center}.life-card .life-icon{font-size:25px}.life-card b{display:block;margin-top:7px;font-size:12px}.life-card small{font-size:10px;color:var(--muted)}
.log-item{border-left:2px solid var(--rose2);padding:1px 0 1px 12px;margin:10px 4px}.log-item small{color:var(--muted)}.log-item p{margin:2px 0;font-size:12px;line-height:1.5}
.modal-backdrop{position:fixed;z-index:1000;inset:0;background:rgba(40,28,27,.42);display:grid;place-items:end center;padding:20px 12px calc(22px + var(--safe-bottom));backdrop-filter:blur(7px)}.modal{width:min(100%,450px);max-height:78vh;overflow:auto;background:#fffaf7;border-radius:28px;padding:20px;box-shadow:0 30px 80px rgba(28,19,19,.26)}.modal h3{font-family:Georgia,"Songti SC",serif;margin:0 0 9px;font-size:22px}.modal p{font-size:13px;line-height:1.7;color:#5f504c}.modal textarea{width:100%;min-height:210px;border:1px solid var(--line);border-radius:15px;padding:12px;background:#fff;resize:vertical}.modal-actions{display:flex;gap:8px;margin-top:12px}.modal-actions button{flex:1}
.ai-box{padding:16px;background:linear-gradient(145deg,#f5e8e4,#fff);border:1px solid var(--line);border-radius:21px}.ai-box h3{margin:0 0 7px;font-family:Georgia,"Songti SC",serif}.ai-box p{font-size:12px;line-height:1.6;color:var(--muted)}
.kicker{font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
.divider{height:1px;background:var(--line);margin:17px 0}
@media(max-width:370px){.hero{height:270px}.relation-grid{grid-template-columns:1fr 1fr}.msg-row p{max-width:185px}}
</style>
</head>

    paragraphs:[
      "酒店走廊的灯永远亮得很均匀。田曦薇刷开房门时，已经过了十一点，外套上还留着一点上海冬夜的潮气。行李箱只打开了一半，明天围读要用的剧本摊在桌边，她白天贴进去的便签从页缝里露出几截，像还没收好的尾巴。",
      "她把手机从包里拿出来，屏幕亮起，三条未读消息叠在一起。程曼提醒明天围读提前，母亲问她上海是不是降温，最上面那条来自王安宇。田曦薇站在玄关没动，先看见他问“落地了？”下一行又跟着一句，显然还在记昨天运动馆的事。",
      "房间很安静。她今天其实已经累了，但还没有困到能立刻睡着。剧本、消息和楼下二十四小时营业的咖啡厅同时摆在眼前，谁都没有真正催她。"

    paragraphs:[
      "她最后还是坐到了桌边。第六集那场会议戏已经读过很多遍，真正让她停住的却不是周望发火的地方，而是她发完火以后，剧本只写了一句“继续开会”。田曦薇拿笔在旁边画了一道很轻的线，没有立刻写表演备注。",
      "她最近越来越相信，有些人物不是靠增加动作成立，而是靠删掉反应。周望如果真的习惯了把事情处理完，那么最疲惫的时候，也许反而不会给自己留下一个漂亮的崩溃。",
      "看到第十页时，手机又亮了一次。不是王安宇，是程曼发来一句：还没睡就现在去睡。田曦薇盯着屏幕笑了一会儿，觉得经纪人可能在酒店装了监控。"
    ],

    paragraphs:[
      "楼下咖啡厅只剩两桌客人。田曦薇没有化妆，帽檐压得低，选了靠里面的位置。她点了一杯热牛奶，最后又临时加了一块蛋糕，理由是明天开机前总应该给自己一点不需要解释的东西。",
      "手机被她放在桌面上，没有特意翻过去，也没有急着看。玻璃外偶尔有车开过，湿漉漉的路面把灯光拖得很长。她坐了十几分钟，忽然觉得这一天如果就这么结束也很好——没有偶遇，没有重大决定，也没有谁恰好出现。",
      "直到屏幕又亮起来。"
    ],
    choices:[
      ["A","看看是谁。","openMessages"],
      ["B","不看。把蛋糕吃完再回去。","story:n4"],
      ["C","把这一幕记进生活手帐。","life:深夜咖啡"]
    ]

let state = load();

function load(){
  try{
    const x = JSON.parse(localStorage.getItem(SAVE_KEY));
    return Object.assign(structuredClone(defaults), x || {});
  }catch(e){ return structuredClone(defaults); }
}
function save(){ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); updateUnreadDot(); }
function reset(){ localStorage.removeItem(SAVE_KEY); location.reload(); }
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function toast(msg){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t)}t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function nav(tab){state.tab=tab;save();render()}
function updateUnreadDot(){
  const n=Object.values(state.unread).reduce((a,b)=>a+b,0);
  const d=document.getElementById("msgDot"); if(d) d.classList.toggle("show",n>0);

function storyHTML(){

    </section>
    <article class="prose">${n.paragraphs.map(p=>`<p>${p}</p>`).join("")}</article>
    <div class="choice-list">
      ${n.choices.map(c=>`<button class="choice" data-action="${c[2]}"><span class="letter">${c[0]}</span><span class="choice-text">${c[1]}</span><span class="arrow">›</span></button>`).join("")}

function messagesHTML(){
  if(state.openChat) return chatHTML(state.openChat);
  const keys=["wang","zhang","song","cheng","mom"];
  return `<div class="list">${keys.map(k=>{
    const c=contacts[k], arr=state.messages[k]||[], last=arr[arr.length-1]||{text:"",time:""};
    return `<button class="msg-row" data-action="chat:${k}">
      <span class="avatar" style="background-image:url('${c.img}')"></span>
      <span style="min-width:0;text-align:left"><h4>${c.name}</h4><p>${esc(last.text)}</p></span>
      <span><time>${last.time||""}</time>${state.unread[k]?`<span class="badge">${state.unread[k]}</span>`:""}</span>
    </button>`;
  }).join("")}</div>`;
}
function chatHTML(k){
  const c=contacts[k], arr=state.messages[k]||[];
  state.unread[k]=0; save();
  return `
    <div class="chat-head"><button class="back" data-action="backMessages">‹</button><span class="avatar" style="background-image:url('${c.img}')"></span><div><b>${c.name}</b><div style="font-size:10px;color:var(--muted)">私人聊天</div></div></div>
    <div class="chat-area" id="chatArea">${arr.map(m=>`<div class="bubble ${m.from}">${esc(m.text)}<div style="font-size:9px;opacity:.55;margin-top:4px">${m.time||""}</div></div>`).join("")}${state.typing===k?`<div class="typing">${c.name} 正在输入…</div>`:""}</div>
    <div class="quick-replies">${c.quick.map(q=>`<button data-action="quick:${k}" data-text="${esc(q)}">${esc(q)}</button>`).join("")}</div>

}

function bind(){
  document.querySelectorAll("[data-action]").forEach(el=>{
    el.onclick=()=>handle(el.dataset.action,el);
  });
  const area=document.getElementById("chatArea");if(area) area.scrollTop=area.scrollHeight;
}
function handle(a,el){
  if(a.startsWith("tab:")) return nav(a.split(":")[1]);
  if(a.startsWith("story:")){
    const next=a.split(":")[1];
    state.storyHistory.push(state.storyNode); state.storyNode=next; state.tab="story"; save(); render(); window.scrollTo(0,0); return;
  }
  if(a==="openMessages"){state.tab="messages";delete state.openChat;save();render();return}
  if(a.startsWith("openChat:")){state.tab="messages";state.openChat=a.split(":")[1];save();render();return}
  if(a.startsWith("chat:")){state.openChat=a.split(":")[1];save();render();return}
  if(a==="backMessages"){delete state.openChat;save();render();return}
  if(a.startsWith("quick:")) return sendMessage(a.split(":")[1],el.dataset.text);
  if(a.startsWith("send:")){
    const val=(document.getElementById("customMsg")?.value||"").trim(); if(val) sendMessage(a.split(":")[1],val); return;
  }
  if(a.startsWith("relation:")) return showRelation(a.split(":")[1]);
  if(a.startsWith("life:")) return doLife(a.split(":")[1],el.dataset.desc);
  if(a==="openAI") return showAI();
}
function sendMessage(k,text){
  const now=new Date(), tm=now.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",hour12:false});
  state.messages[k].push({from:"me",text,time:tm}); state.typing=k; save(); render();
  setTimeout(()=>{
    const replies={

function doLife(name,desc){
  const outcomes={

function buildPrompt(){
  const rel = Object.entries(people).map(([k,p])=>`${p.name}：${p.tag}。${(state.relationNotes[k]||[]).slice(-2).join("；")}`).join("\n");
  const recent = state.lifeLog.slice(-4).map(x=>`- ${x.date} ${x.title}：${x.text}`).join("\n");
  const node = storyNodes[state.storyNode]||storyNodes.n1;
  return `你正在继续《她的黄金时代》私人互动游戏。请严格延续已有世界，不重新开局。

【当前状态】
日期：${state.date}
城市：${state.city}
项目：${state.project}
当前剧情节点：${node.title}
场景：${node.meta}

【核心关系】
${rel}

【最近生活事件】
${recent}

【写作风格】
第三人称，以田曦薇为主要限知视角。中长段落为主，减少短句来回式对白；环境、动作、观察和心理融在同一段落里。重要对白才单独落下。避免“心头一颤、呼吸一滞、眼底闪过、低沉磁性嗓音、空气暧昧”等套语。人物说话必须明显区分。明星私人社交要考虑狗仔、粉丝、团队和同城合理性，不允许为了恋爱剧情强行偶遇或随意单独约饭。

【人物基调】
王安宇：多年旧友；温柔活泼、聪明、敏感，平时轻松有趣，越在意越可能退一步。
张凌赫：理性务实、外冷内热、高压上升期；田曦薇对其CP营业感仍有防备。
宋威龙：松弛、有幽默感、外柔内刚，年龄更小但相处有稳定的“哥哥感”。
侯明昊：尚未真正进入私人圈；热烈直率、音乐热情强，不得突然私聊。

请生成 1000—1800 字左右的下一段剧情。剧情末尾如果出现真正需要玩家决定的关键节点，给 3—4 个自然选项；如果不需要，不要强行给选项。

最后请附加一个机器可读更新块，格式必须完全如下：
[GAME_UPDATE]
{

}
[/GAME_UPDATE]

不要在更新块中写隐藏好感数值。`;

function modal(inner){
  document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop" id="modalBg"><div class="modal">${inner}<div class="modal-actions"><button class="secondary" id="closeModal">关闭</button></div></div></div>`;
  document.getElementById("closeModal").onclick=closeModal;
  document.getElementById("modalBg").onclick=e=>{if(e.target.id==="modalBg")closeModal()};
}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
document.querySelectorAll(".nav-item").forEach(b=>b.onclick=()=>nav(b.dataset.tab));
document.getElementById("settingsBtn").onclick=()=>modal(`<div class="kicker">SETTINGS</div><h3>私人存档</h3><p>当前存档保存在这个浏览器设备里，不上传服务器。</p><button class="secondary" id="exportSave" style="width:100%;margin-bottom:8px">复制存档 JSON</button><button class="secondary" id="resetSave" style="width:100%;color:#a84455">重置本地存档</button>`);
document.addEventListener("click",e=>{
  if(e.target?.id==="resetSave" && confirm("确定重置试玩存档吗？")) reset();
  if(e.target?.id==="exportSave"){navigator.clipboard.writeText(JSON.stringify(state,null,2));toast("存档 JSON 已复制")}
});
render();
</script>
